# Statically link the MSVC CRT (vcruntime140.dll / msvcp140.dll etc.) so the
# release exe is fully self-contained and runs on a clean Windows install —
# required for the portable single-file distribution.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
