<script>
const $ = id => document.getElementById(id);

const host = location.hostname.toLowerCase().replace(/\.$/, '');
const isOwner = host === 'localhost' || host === '127.0.0.1'
  || host === '::1' || host === '[::1]';
// Webview identity (NOT the same question as isOwner): Tauri injects
// window.__TAURI__ (withGlobalTauri, see tauri.conf.json) before any page
// script runs, so its presence means "inside our own window" — no plain
// browser, phone or desktop, ever has it. isOwner answers "same machine"
// (loopback ⇒ the server grants owner powers); isWebview answers "our shell"
// (Tauri-only capabilities: drag-drop listen, native dialog). A desktop
// browser on localhost isOwner-but-not-webview: owner tools show AND work.
const isWebview = !!(window.__TAURI__ && window.__TAURI__.event);
const me = isOwner ? 'owner' : 'guest';
// The phone's in-flight uploads (downloads are native and out of reach). One
// entry per in-flight request: parallel uploads each keep their own
// row-vanish detection, so stopping the older of two concurrent pushes still
// aborts the right stream instead of reporting a late generic failure.
const inFlightUploads = [];

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1800);
}
// Every failure the user SEES must also land in the server log, or "the app
// showed a failure but the log looks normal" becomes undebuggable — the failure
// paths that never reach the server (a dead network, a browser API throwing)
// left no trace at all. Success and info toasts stay local; failures go here.
// (A failure caused by the network being down still cannot reach the log at
// that instant — the report rides the same broken link; the attempt is the most
// we can do, and the server's request gap is itself evidence.)
function failToast(msg){ clientLog('ui-fail: ' + msg); toast(msg); }

function fmtSize(n){
  if(n<1024) return n+' B';
  const u=['KB','MB','GB']; let i=-1;
  do { n/=1024; i++; } while(n>=1024 && i<u.length-1);
  return n.toFixed(1)+' '+u[i];
}
// Video row suffix from the server-probed moov metadata ({dur_ms, w, h}):
// `500.0 MB · 2:47 · 1920×1080`. Any absent half is hidden, not zeroed —
// a row with no metadata at all (legacy, unparseable) shows size alone.
function fmtDur(ms){
  const s = Math.round(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  const p = n => String(n).padStart(2,'0');
  return h > 0 ? h+':'+p(m)+':'+p(sec) : m+':'+p(sec);
}
function mediaSuffix(it){
  if(!it.media) return '';
  const p = [];
  if(it.media.dur_ms > 0) p.push(fmtDur(it.media.dur_ms));
  if(it.media.w > 0 && it.media.h > 0) p.push(it.media.w+'×'+it.media.h);
  return p.length ? ' · '+p.join(' · ') : '';
}
function fmtTime(unix){
  if(!unix) return '';
  const d = new Date(Number(unix)*1000);
  const p = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function iconFor(name){
  const ext = (name.split('.').pop()||'').toLowerCase();
  if(['jpg','jpeg','png','gif','webp','avif','heic','bmp','svg'].includes(ext)) return '🖼️';
  if(['mp4','mov','m4v','avi','mkv','webm','3gp','3g2'].includes(ext)) return '🎬';
  if(['mp3','m4a','wav','flac','aac','ogg'].includes(ext)) return '🎵';
  if(['pdf'].includes(ext)) return '📕';
  if(['doc','docx','rtf'].includes(ext)) return '📄';
  if(['xls','xlsx','csv'].includes(ext)) return '📊';
  if(['ppt','pptx'].includes(ext)) return '📑';
  if(['zip','rar','7z','tar','gz'].includes(ext)) return '🗜️';
  if(['txt','md','log','json','yml','yaml','toml','ini','srt','vtt','lrc'].includes(ext)) return '📝';
  if(['js','ts','rs','go','py','java','c','cpp','html','css'].includes(ext)) return '⚙️';
  return '📦';
}

// A preview that fails (unsupported codec, truncated bytes) falls back to a
// plain icon card — same shape as non-media — instead of stranding the row as
// bare text: no media pixels means the phone long-press has nothing native to
// offer, and without the icon even the failure is invisible.
function mediaFailed(card, it){
  card.querySelectorAll('img,video').forEach(m => m.remove());
  card.classList.remove('has-preview');
  if(!card.querySelector('.fc-ico')){
    const d = document.createElement('div');
    d.className = 'fc-ico';
    d.innerHTML = iconFor(it.name);
    card.prepend(d);
  }
  paintCorner(it.id);
}

// ---- Server API -----------------------------------------------------------

// Media-class helpers, single source of truth: the renderer, the phone
// "open" action and the long-press convergence all ask the same two questions
// about a file name. Kept ahead of their users (function declarations, so
// hoisting would also work, but one table reads better than three literals).
// Preview classes: keep in lockstep with media::is_video_name on the server
// (poster extraction) and mime_for (inline content type). avi is deliberately
// absent: no browser decodes it, so it stays navigation-to-download instead
// of opening a player that can only spin.
const IMG_EXTS = ['jpg','jpeg','png','gif','webp','avif','heic','bmp','svg'];
const VID_EXTS = ['mp4','mov','m4v','mkv','webm','3gp','3g2'];
const isImgName = n => IMG_EXTS.includes((n.split('.').pop()||'').toLowerCase());
const isVidName = n => VID_EXTS.includes((n.split('.').pop()||'').toLowerCase());
// Every HTTP call to the local server goes through serverFetch(): the method, query
// and body conventions live in exactly one place instead of a bespoke fetch
// per handler. Returns the raw Response, so each caller keeps its own .ok /
// .json() / .text() semantics and its own error policy (toast, swallow or
// reconcile). FormData bodies pass through untouched — the browser must set
// the multipart boundary itself; anything else is JSON-encoded.
function qs(query){ return '?' + new URLSearchParams(query); }
// 403 from any server call = the pairing cookie failed the server's check:
// the process restarted and its token rotated. Reload so the server renders
// its unpaired page (the single expired-session surface, with per-path copy):
// a live tab must not keep pretending to be live on a dead pairing. No
// reload-loop risk: the unpaired page makes zero further requests. Bonus:
// the cookie jar is shared across tabs, so if another tab already rescanned,
// this reload lands straight back in the app instead of a dead card.
let pairExpired = false;
function pairExpiredNow(){
  if(pairExpired) return;
  pairExpired = true;
  try { es.close(); } catch {}
  location.reload();
}
async function serverFetch(path, { method = 'GET', query, body, signal } = {}){
  const init = { method, signal };
  if(body !== undefined){
    init.body = body instanceof FormData ? body : JSON.stringify(body);
    if(!(body instanceof FormData)) init.headers = { 'Content-Type': 'application/json' };
  }
  const url = query ? path + qs(query) : path;
  return fetch(url, init).then(r => {
    // 403 has two sources: the pairing gate (token rotated — reload so the
    // server renders its unpaired page) and the owner-only guards (a tool that
    // should have been hidden — the caller surfaces its own error). The gate
    // marks its refusals with x-tinbox-unpaired; only those reload.
    if(r.status === 403 && r.headers.get('x-tinbox-unpaired')) pairExpiredNow();
    return r;
  });
}

// Context Menu
let ctxTarget = null;
let ctxBubble = null;
let ctxTimer = null;
let suppressClick = false;

function attachMenu(el, it, bubble){
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    showCtxMenu(e.clientX, e.clientY, it, bubble);
  });
  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    ctxTimer = setTimeout(() => {
      ctxTimer = null;
      suppressClick = true;
      showCtxMenu(t.clientX, t.clientY, it, bubble);
    }, 450);
  }, {passive: true});
  el.addEventListener('touchend', () => { if(ctxTimer){ clearTimeout(ctxTimer); ctxTimer = null; } });
  el.addEventListener('touchmove', () => { if(ctxTimer){ clearTimeout(ctxTimer); ctxTimer = null; } });
}

function showCtxMenu(x, y, it, bubble){
  if(it.pending) return;               // mid-upload: no reveal/delete/download yet
  ctxTarget = it;
  ctxBubble = bubble;
  const m = $('ctxMenu');
  m.innerHTML = '';

  const add = (label, iconSvg, cls, fn) => {
    const b = document.createElement('button');
    if(cls) b.className = cls;
    b.innerHTML = `${iconSvg}<span>${label}</span>`;
    b.onclick = (e) => { e.stopPropagation(); hideCtxMenu(); fn(); };
    m.appendChild(b);
  };

  const copyIco = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`;
  const delIco = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`;

  // The context menu is a PC affordance only (right-click), unified to
  // Copy + Delete for every card. The corner folder button owns "open the
  // folder", so Reveal has no menu seat. The phone's long-press belongs to
  // the browser everywhere — media gets the native image menu, text gets
  // native selection + the system copy callout — so the app paints no menu
  // of its own there.
  let any = false;
  if(isOwner){
    if(it.kind === 'text'){
      add('复制', copyIco, '', () => copyText(it));
    } else {
      add('复制', copyIco, '', () => copyFile(it));
    }
    add('删除此' + (it.kind === 'text' ? '消息' : '文件'), delIco, 'danger', () => delItem(it));
    any = true;
  }
  if(!any) return;

  const w = 160, h = 90;
  const left = Math.min(x, window.innerWidth - w - 12);
  const top = Math.min(y, window.innerHeight - h - 12);
  m.style.left = Math.max(8, left) + 'px';
  m.style.top = Math.max(8, top) + 'px';
  m.classList.add('show');
}

async function copyText(it){
  try { await navigator.clipboard.writeText(it.text); toast('已复制'); return; }
  catch {}
  // The phone reaches this page over plain LAN http, which is NOT a secure
  // context — the async Clipboard API does not exist there at all (the try
  // above is really an existence probe). The legacy execCommand path with a
  // synthetic selection is the only copy that works on iOS/Android over http.
  try {
    const ta = document.createElement('textarea');
    ta.value = it.text;
    ta.style.cssText = 'position:fixed;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if(ok) toast('已复制'); else failToast('复制失败');
  } catch { failToast('复制失败'); }
}
// File-card Copy = the FILE itself on the clipboard (CF_HDROP, written by
// the same-process server via /copy-file — the web Clipboard API cannot
// carry files). An Explorer paste, or Ctrl+V into any file target, hands
// over the real bytes. The bitmap route (ClipboardItem 'image/png' after a
// canvas roundtrip) was tried and is NOT trustworthy: the write resolves
// and toasts success, yet Explorer's desktop paste reads nothing — the log
// showed three copy fetches, zero failures reported, empty pastes. One
// path, one writer, always a file.
async function copyFile(it){
  const r = await serverFetch('/copy-file', { method:'POST', query:{ id: it.id } });
  if(r.ok) toast('文件已复制'); else failToast('复制失败');
}
// No confirmation dialog: window.confirm is broken inside the Tauri WebView
// (no dialog plugin -> it resolves to a rejected Promise, which is truthy, so
// the old guard never blocked anything anyway). Delete is a deliberate
// context-menu action; the toast reports the outcome.
async function delItem(it){
  const res = await serverFetch('/rm', { method:'POST', query:{ id: it.id } });
  // "binned" names the bin (space returns after emptying it); record-only
  // removals stay silent. Failures leave record + bytes untouched — the card
  // stays, the log says why, Explorer handles the rest.
  if(res.ok){
    if(it.kind !== 'text' && it.source_kind !== 'local'){
      try { if((await res.text()).trim() === 'binned') toast('已移入回收站'); }
      catch {}
    }
  } else {
    failToast('删除失败，请到收件箱手动删除');
  }
  refresh();
}
async function revealItem(it){
  const res = await serverFetch('/reveal', { method:'POST', query:{ id: it.id } });
  if(!res.ok) failToast('文件不存在');
}
function hideCtxMenu(){ $('ctxMenu').classList.remove('show'); }

document.addEventListener('click', () => {
  if(suppressClick){ suppressClick = false; return; }
  hideCtxMenu();
});
document.addEventListener('scroll', hideCtxMenu, true);

let lastList = '';
let curItems = [];   // latest message list, mirrors what render() is showing
function applyList(items){
  lastServer = items;
  applyListLive(items);
}
// Apply a full message list: dedup against what we already rendered, then
// render + the housekeeping passes. Called from the one-shot refresh() fetch
// and from each SSE `list` event (which carries the full array, so steady
// state makes no /list requests at all).
function applyListLive(items){
  // A pending from="owner" row is the owner's LOCAL copy into its own inbox —
  // a guest is neither sender nor receiver of those bytes, so showing it as a
  // transfer would lie twice ("发送中/接收中" over a wire that carries
  // nothing). A guest first sees the file when the copy graduates; until
  // then the row stays owner-internal. The owner keeps it: its ring rides the
  // copy's progress pushes.
  if(!isOwner) items = items.filter(i => !(i.pending && i.from === 'owner'));
  // Merge the sending phone's optimistic "just picked a file" cards in until the
  // server's real (pending) row appears, so the UI shows the card instantly.
  const view = withOptimistic(items);
  const key = JSON.stringify(view);
  if(key === lastList) return;
  lastList = key;
  curItems = view;
  render(view);
  checkUploadGone(items);
  pruneTransfers(items);
  // Repaint transfer state on every card: appended/rebuilt nodes lost their
  // corner; kept nodes re-apply idempotently.
  repaintTransfers();
}
function reapply(){ lastList = ''; if(lastServer) applyList(lastServer); }
let lastServer = [];
// One-shot fetch, used on page load and on every SSE (re)connect. Link state is
// driven by EventSource (onopen/onerror), not by fetch failures.
async function refresh(){
  try {
    applyList(await (await serverFetch('/list')).json());
  } catch {}
}

// If a file that was being transferred got removed on the server, stop tracking
// it immediately so no stale ring lingers on its (now gone) card. The server
// already cleared its /dl-status entry on /rm; the list event that just arrived
// is what tells us the row is gone.
function pruneTransfers(items){
  const ids = new Set(items.map(i => i.id));
  for(const key of Object.keys(progCache)) if(!ids.has(key)) delete progCache[key];
  for(const key of Object.keys(doneIds))   if(!ids.has(key)) delete doneIds[key];
  for(const key of Object.keys(hideTimers)) if(!ids.has(key)){ clearTimeout(hideTimers[key]); delete hideTimers[key]; }
  for(const id of [...stalledRings]) if(!ids.has(id)) stalledRings.delete(id);
  // Outgoing tids die with their card; a deleted card never gets pulled again.
  for(const key of Object.keys(outProg)) if(!ids.has(outProg[key].card)) delete outProg[key];
  for(const key of Object.keys(outDone)) if(!ids.has(key)) delete outDone[key];
}

// Watch the server list for uploads whose pending row vanished mid-flight
// (sender aborted from another tab, PC cleared all, or the server reaped a
// dead push): each in-flight entry watches its own name+size pair, so once
// its pending row is seen and then vanishes — abort locally so we stop
// streaming into the socket the server already tore down. Entries are
// independent: stopping one of two parallel uploads never touches the other.

// Payload signature of one rendered item: a card is REBUILT in place only when
// this changes (pending→ready, size fix), APPENDED when genuinely new, and
// otherwise left untouched. Timeline order is append-only (ids carry their
// creation timestamp), so a diff-render never refetches the media of kept
// cards and never replays the entrance animation across the whole history —
// the per-new-message flash that used to come with the full innerHTML wipe.
function itemSig(it){
  return it.kind === 'text'
    ? ['text', it.from, it.ts, it.text].join('|')
     : ['file', it.from, it.ts, it.name, it.size, it.pending ? 1 : 0,
        // `local` in the sig forces a rebuild the moment the local card hands
        // off to the server row (same id). Without it a same-second handoff
        // would KEEP the node and its closures would capture the local object
        // forever — with it, the row's node is rebuilt with the row's `it`.
        it.local ? 1 : 0,
        // `queued` likewise: the caption must flip 等待中… → 发送中… when the
        // serial queue reaches this card.
        it.queued ? 1 : 0,
        it.poster ? 1 : 0,
        it.media ? [it.media.dur_ms, it.media.w, it.media.h].join(',') : ''].join('|');
}

function buildEmpty(){
  const e = document.createElement('div');
  e.className = 'empty'; e.id = 'empty';
  e.innerHTML = `
    <div class="e-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 15 4-4 4 4"/><path d="m14 9 4-4 4 4"/><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/></svg>
    </div>
    <div class="e-title">准备就绪</div>
    <div class="e-desc">跨设备互传文字、照片和文件</div>`;
  return e;
}

function buildMsg(it, animate){
  try {
    const mine = it.from === me;
    const msg = document.createElement('div');
    msg.className = 'msg ' + (mine ? 'me' : 'them');
    msg.dataset.id = it.id;
    // Only genuinely new cards replay the entrance animation; an in-place
    // rebuild of an existing id (pending turning ready) must not blink.
    if(!animate) msg.style.animation = 'none';

    // Direction + bubble color carry the sender (one-to-one transfer: no
    // per-message avatar needed — that chrome belongs to group chats).
    const bWrap = document.createElement('div');
    bWrap.className = 'bubble-container';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if(it.kind === 'text'){
      bubble.classList.add('text');
      bubble.textContent = it.text;
      // PC: right-click menu. Phone: nothing at all — long-press is the
      // browser's own word selection with the system 全选/拷贝 callout. A
      // programmatic select-all could not summon that menu reliably on
      // every iOS version, so the native gesture IS the feature.
      if(isOwner) attachMenu(bubble, it, null);
    } else {
      const card = document.createElement('div');
      card.className = 'file-card';
      if(it.pending){ card.dataset.pending = '1'; card.classList.add('pending'); }
      const isImg = !it.pending && isImgName(it.name);
      const isVid = !it.pending && isVidName(it.name);

      // Preview bytes follow the long-press contract: the native media menu
      // (Safari loupe + 存储图像) saves img.src, so IMAGE cards pull the
      // ORIGINAL (/view) on both ends — the phone so "Save Image" stores real
      // bytes, the PC because it holds the file on disk and the pull is
      // loopback. VIDEO cards never pull video bytes for a tile (measured:
      // ~1GB card traffic for one 500MB file per open, zero taps). When the
      // server has a Shell-extracted JPEG they paint that via /poster; until
      // then (or if extract failed) they stay a compact icon row. Either
      // shape taps into the fullscreen preview, the single place video bytes
      // flow, on explicit user intent.
      // With the diff-render below a kept card never refetches; only a
      // genuine rebuild does. Undecodable formats (HEIC on old iOS) fail as
      // before: onerror drops the preview, the card falls back to its icon.
      if(isImg || (isVid && it.poster)){
        card.classList.add('has-preview');
        const img = document.createElement('img');
        // No onload hook: the innerRO gravity already re-pins on every image
        // growth, and one pinning path beats two. onerror stays — a broken
        // image still falls back to its icon card.
        img.onerror = () => mediaFailed(card, it);
        img.src = isVid
          ? '/poster?id=' + encodeURIComponent(it.id) + '&ctx=card'
          : '/view?id=' + encodeURIComponent(it.id) + '&ctx=card';
        img.alt = it.name;
        img.loading = 'lazy';
        // Preview opens from the media element ITSELF on both ends. The card
        // surface stays dead for media, so a long-press that lands on the
        // card's padding (not the image) cannot click-through into the
        // preview on release — on an ordinary webpage the padding is dead
        // too. Long-press ON the image is the browser's native menu.
        // stopPropagation: the card below also opens the preview (padding
        // taps), without it one tap would stack two overlays.
        img.onclick = (e) => { e.stopPropagation(); openPreview(it); };
        card.appendChild(img);
      } else if(isVid){
        const ico = document.createElement('div');
        ico.className = 'fc-ico';
        ico.textContent = '🎬';
        card.appendChild(ico);
      } else {
        card.innerHTML = `<div class="fc-ico">${iconFor(it.name)}</div>`;
      }

      const info = document.createElement('div');
      info.className = 'fc-info';
      info.innerHTML = '<div class="fc-name"></div><div class="fc-size"></div>';
      info.querySelector('.fc-name').textContent = it.name;
      info.querySelector('.fc-size').textContent = fmtSize(it.size) + mediaSuffix(it);
      if(it.pending){
        // Caption by WHAT IS MOVING, not by sender alone: a pending
        // from="guest" row is bytes crossing Wi-Fi (发送 on the guest end, 接收
        // on the owner end); a pending from="owner" row is a LOCAL copy into
        // the inbox — 导入 on the owner end, and guests show nothing at all
        // (they receive nothing; their card appears when the copy graduates). The percent
        // lives in the corner ring on the copying end. A local card still
        // waiting its serial turn (queued) says so instead of claiming to send.
        info.querySelector('.fc-size').textContent +=
          ' · ' + (it.queued ? '等待中…'
            : (it.from === 'owner' ? '导入中…' : (mine ? '发送中…' : '接收中…')));
      }
      card.appendChild(info);

      // Every file card gets a persistent corner button — Download on the
      // phone (handed to the browser's own downloader, which owns progress
      // and cancel), Reveal in Explorer on the PC. Which one is decided by
      // paintCorner on each idle repaint. The same corner hosts the transfer
      // ring where this end mirrors a receiving transfer (PC only).
      const btn = document.createElement('button');
      btn.className = 'dlcardbtn hidden';
      btn.type = 'button';
      btn.onclick = (e) => { e.stopPropagation(); transferClick(it); };
      card.appendChild(btn);
      const ring = document.createElement('div');
      ring.className = 'cardring';
      ring.innerHTML = '<svg viewBox="0 0 30 30">'
        + '<circle class="cr-track" cx="15" cy="15" r="12" pathLength="100"/>'
        + '<circle class="cr-arc" cx="15" cy="15" r="12" pathLength="100"/>'
        + '</svg><span class="cr-glyph"></span>';
      // Sender's stop affordance: the phone's own pending card taps the ring
      // to abort (cancelOwnUpload). The PC ring is progress-only, no handler.
      // A real button-grade node, not a gesture hijack — native long-press is
      // untouched.
      if(!isOwner && it.pending && mine){
        ring.onclick = (e) => { e.stopPropagation(); cancelOwnUpload(it); };
      }
      card.appendChild(ring);

      // Media on both ends opens the instant in-app preview (bytes are
      // already at hand — no reason to cold-start an external viewer for a
      // first glance). On the PC the overlay carries a "用默认应用打开"
      // button for the full viewer; other file types still shell out
      // directly since no in-app viewer beats their native app.
      if(isImg || isVid){
        card.onclick = () => {
          if(it.pending) return;                          // still uploading
          openPreview(it);
        };
      } else if(isOwner){
        card.onclick = () => {
          if(it.pending) return;                          // still uploading
          openDefault(it);
        };
      } else {
        card.onclick = () => {
          if(it.pending) return;                          // still uploading
          // Phone tap = "show it", exactly like tapping a file link on an
          // ordinary webpage: the browser decides — its inline viewer for
          // PDF/text, its own download flow (with its own progress UI) for
          // anything else. The corner button stays the explicit download.
          location.href = '/view?id=' + encodeURIComponent(it.id) + '&ctx=nav';
        };
      }
      // The app's long-press menu is a PC affordance only (right-click). On
      // the phone the long-press gesture is handed to the browser's native
      // media menu on cards, and is simply dead on non-media files (their one
      // action, Download, lives on the corner button) — no 450ms timer, no
      // custom items, no suppression fighting the platform.
      if(isOwner) attachMenu(card, it, bubble);
      bubble.appendChild(card);
    }

    const meta = document.createElement('div');
    meta.className = 'meta-line';
    meta.textContent = fmtTime(it.ts);

    bWrap.appendChild(bubble);
    bWrap.appendChild(meta);
    msg.appendChild(bWrap);
    return msg;
  } catch(err){
    // One bad message must not blank the whole timeline: report it and move on.
    reportClientError('render: skipped '+(it.name||it.text||'')+' ('+it.id+'): '+(err && err.message ? err.message : String(err)));
    return null;
  }
}

// Stick-to-bottom: a fresh window always opens pinned to the latest message
// (firstPaint — there is no saved position; the webview is rebuilt on every
// open), which is exactly what a chat app does: the newest message is what
// you came back to see. The hard part is late layout — at first paint every
// media box is 0px tall, then images decode/lazy-load, so the timeline keeps
// growing after the first scrollTop assign and a one-shot jump strands the
// view mid-list. The bottom is therefore a resting state held by gravity
// (innerRO below), not a jump to be timed right. Each media element also
// re-pins on load as backup. A manual scroll-up clears stickBottom, so
// reading history is never yanked.
let stickBottom = true;
let firstPaint = true;
// Causal order, no clocks: every pin and every user input takes a number;
// a non-bottom scroll position disarms only if the user did something AFTER
// our last pin (inputSeq > pinSeq). A pin's own late echo always loses that
// comparison, so it can never suicide stickiness no matter how noisy the
// boot layout is. Any order of echo vs input converges: continuous user
// input always outnumbers the single echo per pin.
let seq = 0, pinSeq = 0, inputSeq = 0;
function pinToBottom(){
  pinSeq = ++seq;
  $('chat').scrollTop = $('chat').scrollHeight;
}
// Gravity, not chase: the observer fires after EVERY content growth the inner
// undergoes — image decode, font swap, anything future — at any time, with no
// window to tune and no 2s cap to outrun. Pinning only ever sets scrollTop;
// it never resizes anything, so the loop cannot feed itself. When the user
// scrolls up, stickBottom is false and growth is correctly ignored, leaving
// scroll anchoring to hold their reading position.
const innerRO = new ResizeObserver(() => { if(stickBottom) pinToBottom(); });
innerRO.observe($('chatInner'));
// The phone's toolbar collapse changes the viewport height after load; a pin
// taken against the pre-collapse viewport sits slightly high. Re-pin on any
// viewport resize while parked at the bottom.
function repinOnResize(){ if(stickBottom) pinToBottom(); }
window.addEventListener('resize', repinOnResize);
if(window.visualViewport) window.visualViewport.addEventListener('resize', repinOnResize);
// Unseen-below counter backing the jump-to-latest button: render() bumps it by
// the number of genuinely new cards (appends only — in-place rebuilds and
// deletes don't count), a manual scroll back to the bottom clears it.
let unseenCount = 0;
function showToBottom(){
  const c = $('toBottomCount');
  c.textContent = unseenCount > 99 ? '99+' : String(unseenCount);
  c.classList.toggle('show', unseenCount > 0);
  $('toBottom').classList.add('show');
}
function hideToBottom(){
  unseenCount = 0;
  $('toBottomCount').classList.remove('show');
  $('toBottom').classList.remove('show');
}
$('toBottom').onclick = () => { pinToBottom(); hideToBottom(); };
// Any user input takes a sequence number (capture: it precedes the scroll it
// causes). Scrollbar drags, keys and menu clicks all count — direction is
// irrelevant, because disarming still requires a non-bottom position below.
// The composer is excluded: typing (and the tap that focuses it) is not
// "reading history", and on the phone the keyboard opening clamps #chat and
// fires an off-bottom scroll event — counting composer input would pair that
// clamp with a fresh inputSeq and disarm gravity exactly while typing.
const composerEl = document.querySelector('.composer');
['wheel', 'touchmove', 'touchstart', 'keydown', 'mousedown'].forEach(ev =>
  document.addEventListener(ev, (e) => {
    if(composerEl && e.target && composerEl.contains(e.target)) return;
    inputSeq = ++seq;
  }, { passive: true, capture: true }));
$('chat').addEventListener('scroll', () => {
  const c = $('chat');
  if(c.scrollTop + c.clientHeight >= c.scrollHeight - 32){
    stickBottom = true; hideToBottom();
  } else if(inputSeq > pinSeq){
    stickBottom = false;
  }
  // else: off-bottom with no input since our last pin — a layout echo
  // (growth between the pin and its event), not the user. Ignore it.
}, { passive: true });

function render(items){
  const chat = $('chat');
  const inner = $('chatInner');
  const wasAtBottom = chat.scrollTop + chat.clientHeight >= chat.scrollHeight - 32;

  // The boot placeholder (#boot) dies on the first real paint, whichever
  // branch: it must never survive next to real cards, and the true empty
  // state below is only ever painted from a confirmed-empty list.
  const bootEl = document.getElementById('boot');
  if(bootEl) bootEl.remove();

  if(!items.length){
    inner.replaceChildren();
    if(!document.getElementById('empty')) inner.appendChild(buildEmpty());
    return;
  }
  const emptyEl = document.getElementById('empty');
  if(emptyEl) emptyEl.remove();

  // Diff against what is on screen: ids still rendered are kept (never
  // touched), changed ids are rebuilt in place, new ids are appended, and
  // survivors of the kept map at the end were deleted on the server.
  const kept = new Map();
  for(const el of inner.children) if(el.dataset.id) kept.set(el.dataset.id, el);

  let added = 0;
  for(const it of items){
    const sig = itemSig(it);
    const old = kept.get(it.id);
    if(old){
      kept.delete(it.id);
      if(old.dataset.sig === sig) continue;
      const el = buildMsg(it, false);
      if(!el) continue;
      el.dataset.sig = sig;
      old.replaceWith(el);
      if(it.kind !== 'text') paintCorner(it.id);
    } else {
      added++;
      const el = buildMsg(it, true);
      if(!el) continue;
      el.dataset.sig = sig;
      inner.appendChild(el);
      if(it.kind !== 'text') paintCorner(it.id);
    }
  }
  for(const el of kept.values()) el.remove();

  // Pin here for the synchronous case; the innerRO gravity below holds it
  // across every late growth afterwards, so there is no window to tune.
  if(firstPaint || wasAtBottom) pinToBottom();
  else if(added > 0){ unseenCount += added; showToBottom(); }
  firstPaint = false;
}

async function openDefault(it){
  const res = await serverFetch('/open', { method:'POST', query:{ id: it.id } });
  if(!res.ok) failToast('文件不存在');
}

// Downloads are NATIVE-ONLY: every file is handed to the browser's own
// downloader (it writes to real disk and shows its own progress). The in-app
// ring below is the PC's receiver ring for pushes arriving from phones (see
// the corner block). There is no JS chunk/OPFS downloader anymore — that
// engine was removed.
// No sender-side delivery marker on the card: cloud drives and transfer
// tools do not badge the sender's file with "downloaded at HH:MM" either —
// receipt is the receiver's own UI to confirm. The download-done fact lives
// in the server log only.
// Local cards (client-side only — no server row for them yet).
// A picked file paints immediately ("Uploading…" on the phone, "复制中…" on the
// PC) before the server round-trips. Each carries an id the client GENERATES
// and sends to the server (?cid= / add-local cid), which adopts it as the row
// id — so card and row are the SAME identity from pick to graduation and the
// view needs no name+size matching at all: a local card is hidden the instant
// an item with its own id appears. That shared identity is also why a card can
// never be re-derived into a phantom twin when a transfer signal stalls (the
// old coverage model's failure mode). Failure drops the card; the batch
// summary toast is the signal. Local cards merge only on their own side.
const optUploads = [];
let cidSeq = 0;
// Filename-safe (catalog::valid_client_id mirrors this): [a-z0-9-], 6..48, no
// leading/trailing dash. Date.now in base36 keeps it unique per pick.
function newCid(){
  const rnd = Math.random().toString(36).slice(2, 6).padEnd(4, '0');
  return 'c-' + Date.now().toString(36) + '-' + (++cidSeq).toString(36) + '-' + rnd;
}
function withOptimistic(serverItems){
  let out = serverItems;
  if(optUploads.length){
    const have = new Set(serverItems.map(i => i.id));
    out = serverItems.slice();
    for(const o of optUploads){
      if((o.from === 'owner') !== isOwner) continue;
      if(have.has(o.id)) continue;   // the server row with this very id exists
      out.push({ id: o.id, ts: String((o.at / 1000) | 0), from: o.from, kind: 'file',
        name: o.name, size: o.size, source_kind: 'remote', pending: true, text: '',
        local: true, queued: !!o.queued });
    }
  }
  return out;
}

// ---- Corner transfer ring ----------------------------------------------
// Each end draws from its own local truth, never synced:
//   PC    — mirrors received bytes (`progress` pushes) for incoming pushes,
//           and served bytes (per-request `card#n` pushes, maxed per card,
//           orange arc) for outgoing pulls. Progress-only on both.
//   Phone — mirrors handed-to-socket bytes (XHR `upload.onprogress`) on its
//           own pending cards; the ring center is its ✕ stop affordance.
//           Pulls draw nothing anywhere in-page — the browser's own download
//           UI owns that. No transfer state crosses the wire, so there is
//           nothing to sync.
const progCache = {};   // id -> {sent,total,t} latest server snapshot (uploads)
const doneIds = {};     // transfers already flashed complete -> corner stays idle
const hideTimers = {};  // per-id "hide the finished ring" timers
// Outgoing pulls, PC only: per-request tid ("card#n") -> {card, sent, total,
// t}. The phone never fills this (syncProgress early-returns there) — its
// download UI is the browser's own. card#n keys never collide with upload
// pending-row ids, so the two mirrors share no state.
const outProg = {};     // tid -> {card, sent, total, t} latest served snapshot
const outDone = {};     // cardId flashed complete for an outgoing pull
// Local ring-idle fallback: the server prunes a silent transfer after 5s and
// broadcasts `resync`, but a dead SSE delivers neither the ticks nor the
// resync. The viewer therefore expires its own rings: no `progress` tick for
// RING_IDLE_MS means "the bytes stopped (or I stopped hearing about them)" —
// either way the ring must not freeze. 6s = 5s server window + 1s margin for
// the 1s monitor tick, the ~1/s push throttle and SSE flight. Silent by
// design (no toast): success/failure truth stays on the server row
// (graduated vs gone); this only guarantees the corner never pollutes.
// A fresh tick un-stalls instantly, so a slow-but-alive transfer re-lights.
const RING_IDLE_MS = 6000;
const stalledRings = new Set();
function pruneIdleRings(){
  if(!isOwner) return;
  const now = Date.now();
  let changed = false;
  for(const id of Object.keys(progCache)){
    const p = progCache[id];
    if(!p || p.sent >= p.total) continue;   // completion flashes via doneIds
    if(now - p.t > RING_IDLE_MS && !stalledRings.has(id)){ stalledRings.add(id); changed = true; }
  }
  if(changed) for(const id of stalledRings) paintCorner(id);
}
function itemById(id){ for(const it of curItems) if(it.id === id) return it; return null; }
const BTN_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
// The PC corner's idle occupant: reveal the file's folder — it is the file's
// source, so its useful idle action is jumping to the location.
const BTN_FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>';
// The ring's only glyph is the completion check (Chrome's download-chip
// pattern); cancel is the center ✕ text.
const GLYPH_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

// What a card's corner should show right now:
//   null -> idle (no transfer) — the Download button may show instead
//   {pct, done} -> a live transfer — draw the ring at pct%
// `done` is true only on the tick the counter crosses 100%, so the caller can
// flash a full ring once before going idle again.
function cornerState(id){
  const it = itemById(id);
  if(!it || it.kind !== 'file') return null;
  // Receiver truth (PC only): every pending row — a phone push landing here
  // and the PC's own drag-in copy alike. Pulls draw nothing here — the
  // puller's browser owns that UI.
  if(!isOwner || !it.pending) return null;
  if(stalledRings.has(id)) return null;   // locally expired, see pruneIdleRings
  const prog = progCache[id];
  const total = (prog && prog.total) || it.size || 1;
  const sent = prog ? Math.min(prog.sent, total) : 0;
  return { pct: total ? sent / total * 100 : 0,
           done: !!(prog && total > 0 && prog.sent >= total) };
}

// Sender truth (phone only): handed-to-socket bytes from the in-flight XHR,
// keyed by name+size so the optimistic card and the server's pending row
// share one number across the id handoff. No entry (or no computable length)
// means no local truth — fall back to the card pulse. Never marked done:
// graduation arrives as the row turning non-pending, which hides the ring.
function senderCornerState(id){
  if(isOwner) return null;
  const it = itemById(id);
  if(!it || it.kind !== 'file' || !it.pending || it.from !== me) return null;
  // id match, not name+size: the card IS the in-flight upload (same cid), so
  // two picks of the same file can never share one ring.
  const up = inFlightUploads.find(u => u.id === id);
  if(!up || typeof up.sent !== 'number' || up.sent < 0) return null;
  const total = it.size || 0;
  if(total <= 0) return { pct: 0, done: false };
  return { pct: Math.min(up.sent, total) / total * 100, done: false };
}

// Repaint one upload's card. The card id IS the upload id, so there is exactly
// one — no name+size scan, no second paint during a pending→ready handoff.
// Throttled to ~7/s: progress events fire per chunk.
function paintSenderPair(up, force){
  const now = Date.now();
  if(!force && now - (up.lastPaint || 0) < 150) return;
  up.lastPaint = now;
  paintCorner(up.id);
}

// Outgoing pull aggregate (PC): max served percent across this card's fresh
// per-request tids ("card#n"). Stale tids (no tick past RING_IDLE_MS — a cut
// pull waits for the server prune + resync) are swept here so the ring never
// freezes. done sticks while a fresh completed tid is around; the flash is
// armed once via outDone and re-armed by the next pull's fresh ticks.
function outState(id){
  if(!isOwner) return null;
  const it = itemById(id);
  if(!it || it.kind !== 'file' || it.pending) return null;
  const now = Date.now();
  let pct = -1, done = false;
  for(const key of Object.keys(outProg)){
    const o = outProg[key];
    if(o.card !== id) continue;
    if(now - o.t > RING_IDLE_MS){ delete outProg[key]; continue; }
    const total = o.total || 0;
    if(total <= 0){ pct = 100; done = true; continue; }
    const p = Math.min(o.sent, total) / total * 100;
    if(p > pct) pct = p;
    if(o.sent >= total) done = true;
  }
  if(pct < 0) return null;
  return { pct, done };
}

// Paint one card's corner: the ring while a transfer this end tracks is
// live, the end's persistent action button otherwise (Download on the phone,
// Reveal in Explorer on the PC). Called after every render (cards were
// rebuilt) and on every `progress` tick; idle cards early-return so cost
// scales with activity.
function paintCorner(id){
  const card = document.querySelector('.msg[data-id="'+id+'"] .file-card');
  if(!card) return;
  const ring = card.querySelector('.cardring');
  const btn = card.querySelector('.dlcardbtn');
  if(!ring || !btn) return;
  let st = cornerState(id);
  // A completion that was already flashed is idle now, not a ring to re-show.
  if(st && st.done && doneIds[id]) st = null;

  // Sender-side ring (phone): local XHR truth. Shares the disc, adds the
  // ✕ stop affordance; no completion flash — graduation hides the ring.
  if(!st && !isOwner){
    const sst = senderCornerState(id);
    if(sst){
      btn.classList.add('hidden');
      card.classList.add('transferring');
      ring.classList.add('show', 'canstop');
      ring.classList.remove('done');
      ring.querySelector('.cr-arc').classList.remove('out');
      const p = Math.max(0, Math.min(100, sst.pct));
      ring.classList.toggle('p0', !(p > 0));
      ring.querySelector('.cr-arc').style.strokeDasharray = p + ' ' + (100 - p);
      const glyph = ring.querySelector('.cr-glyph');
      glyph.classList.add('cancel');
      glyph.classList.remove('pct');
      glyph.innerHTML = '';
      glyph.textContent = '✕';
      return;
    }
  }

  // Outgoing pull (PC): this card's bytes are being pulled by a paired
  // browser. Same disc, orange arc (.out) to tell it apart from incoming;
  // progress-only, never a button.
  if(!st && isOwner){
    const o = outState(id);
    if(o && !(o.done && outDone[id])){
      btn.classList.add('hidden');
      card.classList.add('transferring');
      ring.classList.add('show');
      ring.classList.remove('done', 'canstop');
      const arc = ring.querySelector('.cr-arc');
      arc.classList.add('out');
      const p = Math.max(0, Math.min(100, o.pct));
      ring.classList.toggle('p0', !(p > 0));
      arc.style.strokeDasharray = p + ' ' + (100 - p);
      ring.title = '正在被拉取 ' + Math.round(p) + '%';
      const glyph = ring.querySelector('.cr-glyph');
      glyph.classList.remove('cancel');
      if(o.done){
        glyph.classList.remove('pct');
        glyph.innerHTML = GLYPH_DONE;
        ring.classList.add('done');
        outDone[id] = true;
        if(hideTimers[id]) clearTimeout(hideTimers[id]);
        hideTimers[id] = setTimeout(() => paintCorner(id), 1200);
      } else {
        glyph.classList.add('pct');
        glyph.textContent = Math.round(p) + '%';
        if(hideTimers[id]){ clearTimeout(hideTimers[id]); hideTimers[id] = null; }
      }
      return;
    }
  }

  if(!st){
    ring.classList.remove('show', 'done', 'p0', 'canstop');
    card.classList.remove('transferring');
    ring.querySelector('.cr-arc').classList.remove('out');
    const glyph = ring.querySelector('.cr-glyph');
    if(glyph){ glyph.classList.remove('cancel', 'pct'); glyph.innerHTML = ''; }
    if(!card.dataset.pending){
      // The corner's idle occupant is a persistent action button on both
      // ends, each pointing at what that end can do with the file: the PC
      // (the file's source) reveals its folder; the phone re-downloads
      // through its browser (Files/Downloads dir). Uniform on every card
      // including images: the Files destination is a real need (originals,
      // re-sharing), and per-type exceptions only puzzle. Both yield the
      // corner to a live ring, so each never gets hidden by the transfers
      // the other end runs.
      if(isOwner){
        btn.classList.remove('hidden');
        btn.innerHTML = BTN_FOLDER;
        btn.title = '在资源管理器中显示';
      } else {
        btn.classList.remove('hidden');
        btn.innerHTML = BTN_DL;
        btn.title = '下载';
      }
      return;
    }
    btn.classList.add('hidden');
    return;
  }

  // Transferring: the ring owns the corner and the button hides. The card drops
  // its idle pulse so the ring is the only motion signal.
  btn.classList.add('hidden');
  card.classList.add('transferring');
  ring.classList.add('show');
  ring.classList.remove('canstop');
  ring.querySelector('.cr-arc').classList.remove('out');
  ring.classList.toggle('done', !!st.done);
  const p = Math.max(0, Math.min(100, st.pct));
  // A zero-length dash with round caps would paint a stray dot at 0% — hide
  // the arc there instead (class p0).
  ring.classList.toggle('p0', !(p > 0));
  ring.querySelector('.cr-arc').style.strokeDasharray = p + ' ' + (100 - p);
  // The number lives in the tooltip, not on the ring.
  ring.title = Math.round(p) + '%';
  // Center flashes the completion check; while moving it shows the live
  // percent (the disc's whole job now that the ✕ is gone).
  const glyph = ring.querySelector('.cr-glyph');
  glyph.classList.remove('cancel');
  if(st.done){
    glyph.classList.remove('pct');
    glyph.innerHTML = GLYPH_DONE;
  } else {
    glyph.classList.add('pct');
    glyph.textContent = Math.round(p) + '%';
  }

  if(!st.done && hideTimers[id]){ clearTimeout(hideTimers[id]); hideTimers[id] = null; }
  if(st.done && !doneIds[id]){
    // Crossed 100%: hold the check a beat, then go idle.
    doneIds[id] = true;
    hideTimers[id] = setTimeout(() => paintCorner(id), 1200);
  }
}

// render() rebuilt the DOM and wiped every corner; bring back the rings of any
// card that is still mid-transfer.
function repaintTransfers(){
  for(const it of curItems){
    if(it.kind === 'file') paintCorner(it.id);
  }
}

// Corner-button action: the phone hands the file to the browser's native
// downloader, every time — no guards and no mirror, an in-flight pull is the
// browser's business (its own UI shows progress and cancel), and a second tap
// simply starts another download. The PC's counterpart is revealing the
// file's folder.
function transferClick(it){
  if(it.pending) return;                 // still uploading, nothing to act on
  if(isOwner){ revealItem(it); return; }
  downloadFile(it);
}

// Sender-side abort: the phone stops its OWN upload. Local abort first (the
// XHR settles false and finish() drops the optimistic card), then /cancel with the real id so the
// server's pending row + partial file die at once instead of waiting out the
// 5s silence timeout. Both ends converge on the next List push: the card
// vanishes on PC and phone alike — i.e. the failure path, not a delete.
// A card whose row has not been seen yet: local abort alone, the writer (if it
// ever lands) dies on the broken socket / timeout.
async function cancelOwnUpload(it){
  let seen = false;
  for(const up of [...inFlightUploads]){
    if(up.id === it.id){
      seen = seen || up.seen;
      try { up.ac.abort(); } catch {}
    }
  }
  for(let i = optUploads.length - 1; i >= 0; i--){
    if(optUploads[i].id === it.id) optUploads.splice(i, 1);
  }
  // /cancel only once the server has a row for this very id; before that the
  // local abort alone is enough (the writer, if it ever lands, dies on the
  // broken socket / timeout).
  if(seen){
    try { await serverFetch('/cancel', { method:'POST', query:{ id: it.id } }); } catch {}
  }
  reapply();
}
function checkUploadGone(items){
  for(const up of inFlightUploads){
    // The row wears the upload's OWN id (the cid the server adopted): names
    // are ambiguous (older copies of the same file share name+size), ids are
    // not, so exactly one row can ever match and nothing is inferred.
    const row = items.find(i => i.id === up.id);
    if(row){
      up.seen = true;
      if(!row.pending && !up.graduated){
        // Our row is no longer pending: the server has the whole file on disk.
        // That is completion, full stop. The HTTP response must not get a veto:
        // on iOS WebKit a large raw `send(File)` body had its 200 delivered and
        // TCP-acked yet the XHR never fired onload, so the ack cannot be
        // trusted to decide. Settle success here, then drop the ack socket so
        // it cannot leak a reserved connection.
        up.graduated = true;
        if(up.settle) up.settle(true, 'sse-graduated');
        up.ac.abort();
      }
      continue;
    }
    // Our own row vanished without graduating: the server tore the push down
    // (sender abort from another tab, PC clear-all, or a reaped dead push).
    // Stop streaming; the abort settles the upload as failure. Before the row
    // was ever seen there is nothing to conclude — the ack or the backstop
    // decides.
    if(up.seen){
      up.seen = false;
      up.via = up.via || 'sse-gone';
      up.ac.abort();
    }
  }
}

// Fullscreen media preview for image/video, both ends: the bytes are already
// at hand (the card pulled /view), so this is instant where ShellExecuteing
// an external viewer costs a cold start. The fullscreen layer deliberately
// keeps the BROWSER's native long-press callout: it shows the ORIGINAL bytes,
// so the platform's "Save Image" / "Download" / share sheet operates on the
// real photo — the one place where native menus are both natural and
// byte-correct. Owner-only second step: a pill button shells out to the system
// default viewer (openDefault → /open) for zoom/edit and for formats whose
// native app beats any in-app view.
function openPreview(it){
  if(!isImgName(it.name) && !isVidName(it.name)) return;   // only media previews
  const isVid = isVidName(it.name);
  const ov = document.createElement('div');
  ov.className = 'media-ov';
  const src = '/view?id='+encodeURIComponent(it.id)+'&ctx=full';
  // NOTE: parens are load-bearing — ?: binds looser than +, without them the
  // video branch would swallow the buttons below (overlay with no ✕, then a
  // null.onclick throw before appendChild, i.e. tap does nothing at all).
  ov.innerHTML = (isVid
    ? '<video src="'+src+'" controls autoplay playsInline></video>'
    : '<img src="'+src+'">')
    + '<button class="mo-close" aria-label="关闭">'
    + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    + '</button>'
    + (isOwner ? '<button class="mo-open">用默认应用打开</button>' : '');
  // Image: any tap dismisses (the whole layer IS the photo). Video: only the
  // backdrop or the ✕ dismisses — taps on the video itself must reach the
  // native controls (play/pause/seek), not close the layer under the finger.
  ov.onclick = (e) => { if(!isVid || e.target === ov) ov.remove(); };
  ov.querySelector('.mo-close').onclick = (e) => { e.stopPropagation(); ov.remove(); };
  if(isOwner) ov.querySelector('.mo-open').onclick = (e) => { e.stopPropagation(); openDefault(it); };
  document.body.appendChild(ov);
}

// Phone "download": hand every file to the browser's own downloader, which
// writes to real disk with system-managed memory and resume, and shows the OS's
// own progress ring. Browsers require a user gesture to start a download — the
// corner tap is that gesture, which is also why a PC push never auto-downloads
// on the phone.
function downloadFile(it){
  nativeDownload(it);
}

// Native download: hand the file to the browser's own downloader — it owns
// progress, cancel and error UI, so the page keeps no state at all. Every tap
// is a fresh full GET, and the server keys each pull to its own per-request
// counter ("msg#n" in serve()), so parallel pulls — same file or not — are
// independent and cancelling one never disturbs the others.
function nativeDownload(it){
  const f = document.createElement('iframe');
  f.className = 'dlframe';
  f.style.display = 'none';
  f.src = '/dl?id='+encodeURIComponent(it.id)+'&r='+Date.now();
  document.body.appendChild(f);
  // One hidden trigger iframe per tap; once the response has started the pull
  // belongs to the browser's download manager, so reclaim the node after a
  // generous grace period instead of piling one up per download forever.
  setTimeout(() => f.remove(), 300000);
}

// Transfer snapshots arrive as `progress` SSE events (~1/s per transfer) and
// a one-shot /dl-status resync on connect. The PC applies both directions:
// pending rows it is receiving (keyed by row id) and ready cards being pulled
// (keyed by per-request "card#n", maxed per card at paint). The phone applies
// neither — uploads ride its local XHR truth, downloads its browser UI.
function syncProgress(list){
  if(!isOwner) return;
  const now = Date.now();
  for(const d of list){
    const hash = String(d.id).lastIndexOf('#');
    if(hash > 0){
      // One pull's served bytes: keep per-tid, aggregate at paint. A fresh
      // (non-done) tick re-arms the completion flash for the next pull.
      const card = String(d.id).slice(0, hash);
      const item = itemById(card);
      if(!item || item.kind !== 'file' || item.pending) continue;
      outProg[d.id] = { card, sent: d.sent, total: d.total, t: now };
      if(d.total > 0 && d.sent < d.total){
        if(outDone[card]) delete outDone[card];
        if(hideTimers[card]){ clearTimeout(hideTimers[card]); hideTimers[card] = null; }
      }
      paintCorner(card);
      continue;
    }
    const item = itemById(d.id);
    // Any pending row's ring paints on the PC: both a phone push AND the
    // PC's own drag-in copy stream progress pushes with this end as the
    // place where the bytes land.
    if(!item || !item.pending) continue;
    progCache[d.id] = { sent: d.sent, total: d.total, t: now };
    stalledRings.delete(d.id);   // slow-but-alive re-lights
    paintCorner(d.id);
  }
}

// Fetch the server's live-transfer snapshot, apply it, then reconcile the
// local mirrors with it: refresh counters for rows the server is still
// receiving, drop mirror state for ids it no longer tracks. The server
// pushes nothing on a stopped push or a dead-transfer prune — it broadcasts
// `resync` instead — so this reconcile is what lets a corner return to idle
// instead of freezing on its last value forever.
async function resyncProgress(){
  let snap;
  try { snap = await (await serverFetch('/dl-status')).json(); } catch { return; }
  snap = snap || [];
  syncProgress(snap);
  reconcileMirrors(snap);
  repaintTransfers();
}
function reconcileMirrors(snap){
  const known = new Set(snap.map(d => d.id));
  for(const id of Object.keys(progCache)) if(!known.has(id) && !doneIds[id]) delete progCache[id];
  for(const id of [...stalledRings]) if(known.has(id)) stalledRings.delete(id);
  // A pull gone from the snapshot was cut or pruned server-side: drop its
  // tid so no corner freezes. outDone stays — the flash guard is re-armed by
  // the next pull's fresh ticks and swept with its card.
  for(const key of Object.keys(outProg)) if(!known.has(key)) delete outProg[key];
}

// Double-submit guard: the button used to stay enabled and the input uncleared
// until the server answered, so a slow response plus a second tap delivered
// the same text twice — two POSTs from two connections, two ids, and the
// server cannot tell them apart (every POST is a new message by design). One
// flight at a time; a failure keeps the text for retry.
let sending = false;
function sendText(){
  if(sending) return;
  const t = $('txt');
  const text = t.value.trim();
  if(!text) return;
  sending = true; updateSendBtn();
  serverFetch('/send-text', { method:'POST', body:{ text } }).then(r => {
    sending = false;
    if(r.ok){ t.value = ''; autoSize(); updateSendBtn(); }
    else { updateSendBtn(); failToast('发送失败'); }
  }).catch(() => { sending = false; updateSendBtn(); failToast('发送失败'); });
}

function autoSize(){
  const t = $('txt');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 100) + 'px';
}
function updateSendBtn(){
  $('send').disabled = sending || $('txt').value.trim().length === 0;
}

async function uploadFiles(files){
  if(!files.length) return;
  // Serial, smallest-first: on a LAN one stream already saturates the link,
  // so parallel streams only split the same pipe while contending radio/CPU
  // and risking a starved stream tripping the server's 5s silence kill.
  // Smallest-first keeps parallel's one real win (photos land before a 2GB
  // video) with none of its costs. One request per file still: each gets its
  // own ?size= (the per-request total the server declares on the pending row,
  // so the PC ring's percent is right), its own optimistic card, and its own
  // in-flight entry. A failure skips to the next file, never aborts the
  // queue; one summary toast covers the whole batch.
  const queue = [...files].sort((a, b) => (a.size || 0) - (b.size || 0));
  // Paint EVERY card before the first byte moves, then transfer serially. The
  // serial part is deliberate (above); the queue being invisible is not — cards
  // used to appear one at a time, each only when its OWN transfer began, so a
  // 20-photo pick was a 20-step stutter with no hint of what remained. Now the
  // whole batch is on screen at pick instant and only the progress ring walks
  // down it (a card still awaiting its turn reads 等待中…, see buildMsg).
  const opts = queue.map(f => {
    const o = { id: newCid(), name: f.name || fallbackName(f), size: f.size || 0,
      from: isOwner ? 'owner' : 'guest', at: Date.now(), queued: true };
    optUploads.push(o);
    return o;
  });
  reapply();
  let ok = 0;
  for(let i = 0; i < queue.length; i++) if(await startUpload(queue[i], opts[i])) ok++;
  reapply();
  // Failure-only toasts: the new card in the timeline IS the success
  // confirmation (plus the ring closing). A toast only when something
  // did not land — full success stays silent.
  if(ok < queue.length) failToast(ok === 0 ? '传输失败' : `已发送 ${ok}/${queue.length}`);
}
// MIME-derived fallback for nameless uploads (see startUpload): keeps the
// server's filename, so cache keys and inbox names stay meaningful.
function fallbackName(f){
  const m = /^image\/([a-z0-9]+)/i.exec(f.type || '');
  return 'pasted-image.' + (m ? m[1].toLowerCase() : 'bin');
}
async function startUpload(f, opt){
  // The card was painted by uploadFiles with its whole batch, already wearing
  // the id the server adopts as its row id — see withOptimistic. `opt` is that
  // very entry: its turn has come, so drop the queued caption; the ring below
  // owns the card from here.
  const cid = opt.id;
  opt.queued = false;
  reapply();
  // Multipart body — do NOT switch this to a raw `xhr.send(File)` body. On
  // iOS WebKit (Safari AND Chrome) a large raw upload's 200 response can be
  // delivered and TCP-acked yet the XHR never reaches DONE, so onload never
  // fires; the multipart FormData path does not show this. Pasted clipboard
  // images (long-press 拷贝 on a card, then paste into the composer) often
  // arrive with an EMPTY filename — Safari puts the image AND its URL on the
  // pasteboard, and the file half can be nameless. The server rejects those
  // with a 400 ("bad filename") and the user only sees 传输失败, so name them
  // here from the MIME type so the paste flow uploads like a file.
  const upName = f.name || fallbackName(f);
  const fd = new FormData();
  fd.append('file', f, upName);
  // The abort handle is what checkUploadGone pulls when the pending row
  // vanishes mid-flight: aborting cancels the request mid-stream, so the
  // phone stops writing bytes into a socket the server is already tearing
  // down.
  const ac = new AbortController();
  const up = { ac, id: cid, name: upName, size: f.size || 0, seen: false, sent: 0, lastPaint: 0,
    sentAt: 0, graduated: false, settle: null,
    via: '', httpStatus: 0, respDone: false, lateLogged: false };
  inFlightUploads.push(up);
  const upT0 = Date.now();
  // Success and failure both drop the local card: success because the server
  // row with this same id now exists (the view already hides the local one),
  // failure into the batch summary toast.
  const finish = (ok) => {
    const i = inFlightUploads.indexOf(up);
    if(i >= 0) inFlightUploads.splice(i, 1);
    for(let j = optUploads.length - 1; j >= 0; j--) if(optUploads[j].id === cid) optUploads.splice(j, 1);
    // Client diagnostics — transfers used to leave NO client-side trace at
    // all, so a failure was a silent hole with nothing to debug from. One
    // line per notable upload. `via` names what decided the outcome; `resp=no`
    // is the telling signal: the server row graduated (the file IS safe) but
    // the HTTP ack never completed — the case the SSE-truth completion guards.
    // Normal small successes stay quiet so the log holds signal.
    const now = Date.now();
    const sendMs = up.sentAt ? up.sentAt - upT0 : 0;
    if(!ok || !up.respDone || up.size >= 4 * 1024 * 1024 || sendMs > 10000){
      clientLog('upload ' + (ok ? 'ok' : 'fail')
        + ' via=' + (up.via || '?')
        + ' send=' + sendMs + 'ms total=' + (now - upT0) + 'ms'
        + ' bytes=' + up.size
        + ' http=' + (up.httpStatus || 'none')
        + ' resp=' + (up.respDone ? 'yes' : 'no')
        + ' ' + upName);
    }
    reapply();
  };
  // One boolean for every cause: a torn-down socket wins the race before the
  // row-vanish list event can arrive, so the client genuinely cannot tell a
  // stopped push from a WiFi drop — over-precise toasts only mislead.
  // Every ending collapses into just success vs failure, and the batch
  // summary toast lives in uploadFiles.
  // Transport is XHR, not fetch: fetch never settles on a half-open socket
  // (WiFi dropped mid-POST — neither side errors), leaving the optimistic
  // card pulsing forever. XHR upload progress resets an idle timer; silence
  // past it aborts into the same failure path as everything else. Absolute
  // timeouts would murder slow-but-healthy uploads, so only IDLENESS kills:
  // bytes moving slowly still reset the clock. 8s: the server kills at 5s of
  // its own silence — nothing recoverable is still alive over there, and 3s
  // of margin covers the 1s monitor tick plus retransmit jitter; an elevator
  // ride longer than this re-sends on return.
  let responseTimedOut = false;
  const ok = await new Promise((resolve) => {
    let done = false;
    let idleT = 0, respT = 0;
    const settle = (v, via) => { if(!done){ done = true; if(!up.via) up.via = via || '?'; clearTimeout(idleT); clearTimeout(respT); resolve(v); } };
    // Let checkUploadGone settle this upload on the SERVER's truth (its row
    // graduating, or vanishing). The HTTP response is a fast-path ack only:
    // it has stalled before (a raw `send(File)` body on iOS WebKit had the 200
    // delivered and TCP-acked yet never fired onload), so it must never define
    // completion.
    up.settle = settle;
    const xhr = new XMLHttpRequest();
    // Do not rely on a later `onabort` dispatch to close the Promise: the
    // watchdog exists precisely so a browser/WebView edge case cannot leave
    // the optimistic card alive forever.
    const failAndAbort = (reason) => {
      if(done) return;   // already settled (e.g. graduated via the SSE list)
      try { xhr.abort(); } catch {}
      settle(false, reason);
    };
    // Sender self-abort (cancelOwnUpload) rides the same abort handle.
    ac.signal.addEventListener('abort', () => failAndAbort('signal-abort'), { once: true });
    const armIdle = () => {
      clearTimeout(idleT);
      idleT = setTimeout(() => failAndAbort('idle-timeout'), 8000);
    };
    armIdle();
    // Sender truth for this end's ring: handed-to-socket bytes. Throttled —
    // progress fires per chunk, painting every tick would churn the DOM.
    // Keyed by name+size in senderCornerState, so the optimistic card and
    // the server's pending row share one number across the id handoff.
    xhr.upload.onprogress = (e) => {
      armIdle();
      if(e.lengthComputable){
        up.sent = e.loaded;
        paintSenderPair(up, false);
      }
    };
    xhr.upload.onload = () => {
      up.sentAt = Date.now();
      up.sent = up.size;
      paintSenderPair(up, true);
      clearTimeout(idleT);
      // Body is out. From here the server's list owns completion (the row
      // graduates) and the response is only a fast-path ack — so this timer is
      // a last-resort backstop for "neither the response nor the list push ever
      // arrived", not a normal-path failure. Graduation normally wins first.
      respT = setTimeout(() => {
        if(up.graduated){ settle(true, 'sse-graduated'); return; }
        responseTimedOut = true;
        failAndAbort('resp-timeout');
      }, 15000);
    };
    // A response that completes AFTER the SSE already settled this upload is
    // logged on its own: "did the HTTP ack ever come back?" is exactly the
    // question a Chrome-vs-Safari / weak-link comparison needs answered, and
    // it is invisible otherwise once the transfer was already decided.
    const lateLog = (ev, status) => {
      if(up.lateLogged) return;
      up.lateLogged = true;
      clientLog('upload resp-late ' + ev + ' http=' + (status || 'none')
        + ' after=' + (up.sentAt ? (Date.now() - up.sentAt) : -1) + 'ms ' + upName);
    };
    xhr.onload = () => {
      const wasDone = done;
      up.respDone = true;
      up.httpStatus = xhr.status;
      if(xhr.status === 403) pairExpiredNow();
      const good = xhr.status >= 200 && xhr.status < 300;
      settle(good, good ? 'resp-2xx' : 'resp-' + xhr.status);
      if(wasDone) lateLog('onload', xhr.status);
    };
    xhr.onerror = () => { const wasDone = done; up.respDone = true; settle(false, 'net-error'); if(wasDone) lateLog('onerror'); };
    xhr.onabort = () => { settle(false, 'abort'); };
    xhr.ontimeout = () => { const wasDone = done; up.respDone = true; settle(false, 'timeout'); if(wasDone) lateLog('ontimeout'); };
    xhr.open('POST', '/upload' + qs({ size: f.size || 0, cid }));
    try { xhr.send(fd); } catch(e) { settle(false, 'send-threw'); }
  });
  // Failure is judged here, all causes alike — network death, idle-timeout
  // abort, self-abort, HTTP error statuses. finish() drops the card.
  finish(ok);
  // The request body may have reached disk even though its final HTTP response
  // was lost. Do one non-blocking list/status pass in that ambiguous case;
  // normal failures keep their existing behavior and cause no extra request.
  if(!ok && responseTimedOut) reconcile();
  return ok;
}

// Send real PC paths to /add-local (the plus button and PC drag-and-drop; the
// webview exposes the dropped file's path via the non-standard File.path). The
// server copies each one into the Inbox folder and only then adds its card, so a
// file appears in the timeline once the copy is done. No client-side dedup: the
// only "duplicate" would be one physical drop delivered twice (native event +
// HTML5 drop), and diagnostics prove each environment uses exactly one channel
// (Tauri window: native only; desktop browser: HTML5 only) — nothing to collapse.
async function addLocalPaths(paths){
  if(!paths.length) return;
  const fresh = paths;
  // Optimistic "复制中…" cards, one per path: a big-file copy can take seconds
  // and the timeline must not sit dead. Removed as one batch when this single
  // round-trip resolves; name-based coverage graduates early arrivals with no
  // flicker when the list push wins the race. Basename only: the size is
  // unknowable on this side until the server stats it.
  const base = p => p.split(/[\\/]/).pop() || p;
  const batch = 'b' + (++cidSeq);
  // One cid per picked path; the server adopts each path's first resulting file
  // (a folder's inner files get fresh server ids), so a single-file drop
  // upgrades its card in place instead of flashing a second one.
  const entries = fresh.map(p => ({ path: p, cid: newCid() }));
  for(const e of entries) optUploads.push({ id: e.cid, name: base(e.path), size: 0, from: 'owner', at: Date.now(), batch });
  reapply();
  const dropBatch = () => {
    for(let i = optUploads.length - 1; i >= 0; i--) if(optUploads[i].batch === batch) optUploads.splice(i, 1);
  };
  // Request death (both attempts threw, or !ok): drop the batch, toast stays
  // the signal. An import failure is either impossible (loopback POST cannot
  // die while this page lives) or unattributable (the server never says WHICH
  // sibling was skipped — and "added: 0" also means benign things like
  // re-dragging an in-inbox file). Toasts stay honest.
  const failBatch = () => {
    dropBatch();
    reapply();
  };
  // The webview's fetch reuses pooled keep-alive sockets; after a long idle
  // the first POST can land in a socket the OS already dropped — "Failed to
  // fetch" with the request never reaching the server (the log proves it:
  // no /add-local line, only the unhandledrejection report). One silent
  // retry gets a fresh connection, which is exactly what a manual re-drop
  // did. Still loud after: a real failure toasts twice as hard.
  let r;
  try {
    r = await serverFetch('/add-local', { method:'POST', body:{ paths: entries } });
  } catch {
    // The one observable trace of this bug class: count every silent retry
    // in the server log, so the stale-socket phenomenon goes from folklore
    // to a measurable frequency (the pool's own internals emit no events).
    reportClientError('add-local: first attempt failed to fetch (likely stale pooled socket), retrying');
    try {
      r = await serverFetch('/add-local', { method:'POST', body:{ paths: entries } });
    } catch {
      failBatch();
      failToast('导入失败');
      return;
    }
  }
  if(!r.ok){ failBatch(); failToast('导入失败'); return; }
  dropBatch(); reapply();
  // Failure-only toast: landed cards are the success signal, so silence covers
  // both full success and folder expansion (one dropped path -> N cards, N can
  // exceed the path count). Any shortfall is surfaced with a count — a real copy
  // failure, or a re-drag of a file already in the inbox. The latter is
  // deliberate: dragging a file that is already in the inbox is "sending a file
  // to yourself", called out rather than silently accepted.
  let n = fresh.length;
  try {
    const m = /added:\s*(\d+)/.exec(await r.text());
    if(m) n = parseInt(m[1], 10);
  } catch {}
  if(n < fresh.length) failToast(`有 ${fresh.length - n} 个文件导入失败`);
}
// Tauri fires tauri://drag-drop with the real paths; listening to it covers
// platforms where the File.path injection is missing. In practice only this
// channel fires in the webview (HTML5 drop does not), so no dedup is needed.

  const T = window.__TAURI__;
  // Tauri's native drag-drop owns file drags (dragDropEnabled defaults to true),
  // so the page's HTML5 dragenter never carries `Files` and the overlay's own
  // listener can never light up — the native drag lifecycle has to drive it too.
  // Drop still delivers the real paths.
  T.event.listen('tauri://drag-enter', () => {
    if(isOwner) $('dragOverlay').classList.add('active');
  }).catch(()=>{});
  T.event.listen('tauri://drag-leave', () => {
    $('dragOverlay').classList.remove('active');
  }).catch(()=>{});
  T.event.listen('tauri://drag-drop', e => {
    $('dragOverlay').classList.remove('active');
    const p = e.payload;
    if(p && Array.isArray(p.paths) && p.paths.length) addLocalPaths(p.paths);
  }).catch(()=>{});
}

async function pickLocal(){
  const T = window.__TAURI__;
  if(!T || !T.dialog || !T.dialog.open){
    $('fileInput').click(); return;
  }
  try {
    const picked = await T.dialog.open({ multiple: true, title: '选择文件' });
    // This path has no other observability (the phone picker logs its change /
    // cancel; this one did not), so record what the native dialog returned —
    // the only way a silent return becomes diagnosable.
    //
    // Known and accepted: selecting a .lnk comes back as `null`. Tauri's dialog
    // (rfd) sets FOS_ALLOWMULTISELECT but not FOS_NODEREFERENCELINKS, so the
    // shell dereferences the shortcut instead of handing back the .lnk path;
    // rfd yields None and Tauri maps it to null. That is indistinguishable from
    // a user cancel, so it cannot be toasted without false alarms — we accept
    // the OS default. Drag-and-drop still adds a .lnk (the native drop delivers
    // the real path over a different channel).
    const desc = picked == null ? 'null'
      : Array.isArray(picked) ? `arr n=${picked.length}`
      : `${typeof picked} ${String(picked).slice(0, 120)}`;
    clientLog('pc picker: ' + desc
      + (Array.isArray(picked) && picked.length ? ' ' + JSON.stringify(picked).slice(0, 200) : ''));
    if(!picked) return;
    let paths = [];
    if(Array.isArray(picked)) paths = picked.map(p => typeof p === 'string' ? p : p.path);
    else if(typeof picked === 'string') paths = [picked];
    else if(picked && picked.path) paths = [picked.path];
    addLocalPaths(paths);
  } catch(e) {
    failToast('打开选择器失败');
  }
}

// stays unconditional so a stray drop can never navigate the page away.
function dragHasFiles(e){
  try { return [...(e.dataTransfer ? e.dataTransfer.types : [])].includes('Files'); }
  catch { return false; }

let dragCounter = 0;

  // Letting drops/pastes through would only re-upload the server's own bytes

  // images carry broken file entries whose bytes never arrive (the old
  // multipart endpoint proved it: unparseable bodies), so even the
  // deliberate composer-drop misfires into a 传输失败 toast. Uploads ride
  // the plus-button picker, full stop.
  if(!isOwner) return;
  const files = [...e.dataTransfer.files];
  if(!files.length) return;
  // PC drag-and-drop behaves like the plus button: real paths go to /add-local,
  // which copies them into the Inbox locally (no network upload). Only falls
  // back to an upload when real paths are unavailable (e.g. the phone side).
  if(isOwner){
    const paths = files.map(f => f.path).filter(p => typeof p === 'string' && p);
    if(paths.length === files.length){

      return;
    }
