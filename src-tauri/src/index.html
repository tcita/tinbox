<script>
const $ = id => document.getElementById(id);

const isPC = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const me = isPC ? 'pc' : 'phone';
// The phone's in-flight uploads (downloads are native and out of reach). One
// entry per in-flight request: parallel uploads each keep their own
// peer-refusal detection, so refusing the older of two concurrent pushes still
// aborts the right stream instead of reporting a late generic failure.
const inFlightUploads = [];

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

function fmtSize(n){
  if(n<1024) return n+' B';
  const u=['KB','MB','GB']; let i=-1;
  do { n/=1024; i++; } while(n>=1024 && i<u.length-1);
  return n.toFixed(1)+' '+u[i];
}
function fmtTime(unix){
  if(!unix) return '';
  const d = new Date(Number(unix)*1000);
  const p = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function iconFor(name){
  const ext = (name.split('.').pop()||'').toLowerCase();
  if(['jpg','jpeg','png','gif','webp','heic','bmp','svg'].includes(ext)) return '🖼️';
  if(['mp4','mov','avi','mkv','webm'].includes(ext)) return '🎬';
  if(['mp3','m4a','wav','flac','aac','ogg'].includes(ext)) return '🎵';
  if(['pdf'].includes(ext)) return '📕';
  if(['doc','docx','rtf'].includes(ext)) return '📄';
  if(['xls','xlsx','csv'].includes(ext)) return '📊';
  if(['ppt','pptx'].includes(ext)) return '📑';
  if(['zip','rar','7z','tar','gz'].includes(ext)) return '🗜️';
  if(['txt','md','log','json'].includes(ext)) return '📝';
  if(['js','ts','rs','go','py','java','c','cpp','html','css'].includes(ext)) return '⚙️';
  return '📦';
}

// A preview that fails (unsupported codec, truncated bytes) falls back to a
// plain icon card — same shape as non-media — instead of stranding the row as
// bare text: no media pixels means the phone long-press has nothing native to
// offer, and without the icon even the failure is invisible.
function mediaFailed(card, it){
  card.querySelectorAll('img,video').forEach(m => m.remove());
  card.classList.remove('has-preview');
  if(!card.querySelector('.fc-ico')){
    const d = document.createElement('div');
    d.className = 'fc-ico';
    d.innerHTML = iconFor(it.name);
    card.prepend(d);
  }
  paintCorner(it.id);
}

// ---- Server API -----------------------------------------------------------

// Media-class helpers, single source of truth: the renderer, the phone
// "open" action and the long-press convergence all ask the same two questions
// about a file name. Kept ahead of their users (function declarations, so
// hoisting would also work, but one table reads better than three literals).
const IMG_EXTS = ['jpg','jpeg','png','gif','webp','heic','bmp','svg'];
const VID_EXTS = ['mp4','mov','avi','mkv','webm'];
const isImgName = n => IMG_EXTS.includes((n.split('.').pop()||'').toLowerCase());
const isVidName = n => VID_EXTS.includes((n.split('.').pop()||'').toLowerCase());
// Every HTTP call to the local server goes through api(): the method, query
// and body conventions live in exactly one place instead of a bespoke fetch
// per handler. Returns the raw Response, so each caller keeps its own .ok /
// .json() / .text() semantics and its own error policy (toast, swallow or
// reconcile). FormData bodies pass through untouched — the browser must set
// the multipart boundary itself; anything else is JSON-encoded.
function qs(query){ return '?' + new URLSearchParams(query); }
// 403 from any server call = the pairing cookie failed the server's check:
// the process restarted and its token rotated. Reload so the server renders
// its unpaired page (the single expired-session surface, with per-path copy):
// a live tab must not keep pretending to be live on a dead pairing. No
// reload-loop risk: the unpaired page makes zero further requests. Bonus:
// the cookie jar is shared across tabs, so if another tab already rescanned,
// this reload lands straight back in the app instead of a dead card.
let pairExpired = false;
function pairExpiredNow(){
  if(pairExpired) return;
  pairExpired = true;
  try { es.close(); } catch {}
  location.reload();
}
async function api(path, { method = 'GET', query, body, signal } = {}){
  const init = { method, signal };
  if(body !== undefined){
    init.body = body instanceof FormData ? body : JSON.stringify(body);
    if(!(body instanceof FormData)) init.headers = { 'Content-Type': 'application/json' };
  }
  const url = query ? path + qs(query) : path;
  return fetch(url, init).then(r => { if(r.status === 403) pairExpiredNow(); return r; });
}

// Context Menu
let ctxTarget = null;
let ctxBubble = null;
let ctxTimer = null;
let suppressClick = false;

function attachMenu(el, it, bubble){
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    showCtxMenu(e.clientX, e.clientY, it, bubble);
  });
  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    ctxTimer = setTimeout(() => {
      ctxTimer = null;
      suppressClick = true;
      showCtxMenu(t.clientX, t.clientY, it, bubble);
    }, 450);
  }, {passive: true});
  el.addEventListener('touchend', () => { if(ctxTimer){ clearTimeout(ctxTimer); ctxTimer = null; } });
  el.addEventListener('touchmove', () => { if(ctxTimer){ clearTimeout(ctxTimer); ctxTimer = null; } });
}

function showCtxMenu(x, y, it, bubble){
  if(it.pending) return;               // mid-upload: no reveal/delete/download yet
  ctxTarget = it;
  ctxBubble = bubble;
  const m = $('ctxMenu');
  m.innerHTML = '';

  const add = (label, iconSvg, cls, fn) => {
    const b = document.createElement('button');
    if(cls) b.className = cls;
    b.innerHTML = `${iconSvg}<span>${label}</span>`;
    b.onclick = (e) => { e.stopPropagation(); hideCtxMenu(); fn(); };
    m.appendChild(b);
  };

  const copyIco = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>`;
  const delIco = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`;

  // The context menu is a PC affordance only (right-click), unified to
  // Copy + Delete for every card. The corner folder button owns "open the
  // folder", so Reveal has no menu seat. The phone's long-press belongs to
  // the browser everywhere — media gets the native image menu, text gets
  // native selection + the system copy callout — so the app paints no menu
  // of its own there.
  let any = false;
  if(isPC){
    if(it.kind === 'text'){
      add('复制', copyIco, '', () => copyText(it));
    } else {
      add('复制', copyIco, '', () => copyFile(it));
    }
    add('删除', delIco, 'danger', () => delItem(it));
    any = true;
  }
  if(!any) return;

  const w = 160, h = 90;
  const left = Math.min(x, window.innerWidth - w - 12);
  const top = Math.min(y, window.innerHeight - h - 12);
  m.style.left = Math.max(8, left) + 'px';
  m.style.top = Math.max(8, top) + 'px';
  m.classList.add('show');
}

async function copyText(it){
  try { await navigator.clipboard.writeText(it.text); toast('已复制'); return; }
  catch {}
  // The phone reaches this page over plain LAN http, which is NOT a secure
  // context — the async Clipboard API does not exist there at all (the try
  // above is really an existence probe). The legacy execCommand path with a
  // synthetic selection is the only copy that works on iOS/Android over http.
  try {
    const ta = document.createElement('textarea');
    ta.value = it.text;
    ta.style.cssText = 'position:fixed;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    toast(ok ? '已复制' : '复制失败');
  } catch { toast('复制失败'); }
}
// File-card Copy = the FILE itself on the clipboard (CF_HDROP, written by
// the same-process server via /copy-file — the web Clipboard API cannot
// carry files). An Explorer paste, or Ctrl+V into any file target, hands
// over the real bytes. The bitmap route (ClipboardItem 'image/png' after a
// canvas roundtrip) was tried and is NOT trustworthy: the write resolves
// and toasts success, yet Explorer's desktop paste reads nothing — the log
// showed three copy fetches, zero failures reported, empty pastes. One
// path, one writer, always a file.
async function copyFile(it){
  const r = await api('/copy-file', { method:'POST', query:{ id: it.id } });
  toast(r.ok ? '文件已复制' : '复制失败');
}
// No confirmation dialog: window.confirm is broken inside the Tauri WebView
// (no dialog plugin -> it resolves to a rejected Promise, which is truthy, so
// the old guard never blocked anything anyway). Delete is a deliberate
// context-menu action; the toast reports the outcome.
async function delItem(it){
  const res = await api('/rm', { method:'POST', query:{ id: it.id } });
  if(res.ok) toast('已删除');
  else toast('删除失败');
  refresh();
}
async function revealItem(it){
  const res = await api('/reveal', { method:'POST', query:{ id: it.id } });
  if(!res.ok) toast('文件不存在');
}
function hideCtxMenu(){ $('ctxMenu').classList.remove('show'); }

document.addEventListener('click', () => {
  if(suppressClick){ suppressClick = false; return; }
  hideCtxMenu();
});
document.addEventListener('scroll', hideCtxMenu, true);

let lastList = '';
let curItems = [];   // latest message list, mirrors what render() is showing
// Boot gate (PC): the first paint must be atomic — timeline XOR QR gate —
// never the timeline flashing before the gate. The first list and the first
// info arrive within ms of each other (the SSE replay is list→info→fw back
// to back, and the one-shot /list fetch races alongside), so the first PC
// list is held until the first info lands, then exactly one surface is
// revealed (see the boot step in applyInfo, 3s fallback below). The phone has
// no gate decision, so it paints on its first list as before.
let booted = false;
let bootList = null;
function applyList(items){
  lastServer = items;
  if(isPC && !booted){ bootList = items; return; }
  applyListLive(items);
}
// Apply a full message list: dedup against what we already rendered, then
// render + the housekeeping passes. Called from the one-shot refresh() fetch
// and from each SSE `list` event (which carries the full array, so steady
// state makes no /list requests at all).
function applyListLive(items){
  // A pending from="pc" row is the PC's LOCAL copy into its own inbox — the
  // phone is neither sender nor receiver of those bytes, so showing it as a
  // transfer would lie twice ("发送中/接收中" over a wire that carries
  // nothing). The phone first sees the file when the copy graduates; until
  // then the row stays PC-internal. The PC keeps it: its ring rides the
  // copy's progress pushes.
  if(!isPC) items = items.filter(i => !(i.pending && i.from === 'pc'));
  // Merge the sending phone's optimistic "just picked a file" cards in until the
  // server's real (pending) row appears, so the UI shows the card instantly.
  const view = withOptimistic(items);
  const key = JSON.stringify(view);
  if(key === lastList) return;
  lastList = key;
  curItems = view;
  render(view);
  checkUploadGone(items);
  pruneTransfers(items);
  // Repaint transfer state on every card: appended/rebuilt nodes lost their
  // corner and pulse; kept nodes re-apply idempotently.
  repaintTransfers();
  repaintDownloads();
}
function reapply(){ lastList = ''; if(lastServer) applyList(lastServer); }
let lastServer = [];
// One-shot fetch, used on page load and on every SSE (re)connect. Link state is
// driven by EventSource (onopen/onerror), not by fetch failures.
async function refresh(){
  try {
    applyList(await (await api('/list')).json());
  } catch {}
}

// If a file that was being transferred got removed on the server, stop tracking
// it immediately so no stale ring lingers on its (now gone) card. The server
// already cleared its /dl-status entry on /rm; the list event that just arrived
// is what tells us the row is gone.
function pruneTransfers(items){
  const ids = new Set(items.map(i => i.id));
  for(const key of Object.keys(progCache)) if(!ids.has(key)) delete progCache[key];
  for(const key of Object.keys(doneIds))   if(!ids.has(key)) delete doneIds[key];
  for(const key of Object.keys(hideTimers)) if(!ids.has(key)){ clearTimeout(hideTimers[key]); delete hideTimers[key]; }
  // No paint needed: the row is gone, so there is no card left to pulse.
  for(const key of Object.keys(dlActive)) if(!ids.has(key)) delete dlActive[key];
}

// Watch the server list for uploads the PC refused: each in-flight entry
// watches its own name+size pair, so once its pending row is seen and then
// vanishes, that push was refused — abort locally so we stop streaming into
// the socket the server already tore down. Entries are independent: refusing
// one of two parallel uploads never touches the other's detection.

// Payload signature of one rendered item: a card is REBUILT in place only when
// this changes (pending→ready, size fix), APPENDED when genuinely new, and
// otherwise left untouched. Timeline order is append-only (ids carry their
// creation timestamp), so a diff-render never refetches the media of kept
// cards and never replays the entrance animation across the whole history —
// the per-new-message flash that used to come with the full innerHTML wipe.
function itemSig(it){
  return it.kind === 'text'
    ? ['text', it.from, it.ts, it.text].join('|')
    : ['file', it.from, it.ts, it.name, it.size, it.pending ? 1 : 0].join('|');
}

function buildEmpty(){
  const e = document.createElement('div');
  e.className = 'empty'; e.id = 'empty';
  e.innerHTML = `
    <div class="e-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 15 4-4 4 4"/><path d="m14 9 4-4 4 4"/><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/></svg>
    </div>
    <div class="e-title">准备就绪</div>
    <div class="e-desc">跨设备互传文字、照片和文件</div>`;
  return e;
}

function buildMsg(it, animate){
  try {
    const mine = it.from === me;
    const msg = document.createElement('div');
    msg.className = 'msg ' + (mine ? 'me' : 'them');
    msg.dataset.id = it.id;
    // Only genuinely new cards replay the entrance animation; an in-place
    // rebuild of an existing id (pending turning ready) must not blink.
    if(!animate) msg.style.animation = 'none';

    // Direction + bubble color carry the sender (one-to-one transfer: no
    // per-message avatar needed — that chrome belongs to group chats).
    const bWrap = document.createElement('div');
    bWrap.className = 'bubble-container';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if(it.kind === 'text'){
      bubble.classList.add('text');
      bubble.textContent = it.text;
      // PC: right-click menu. Phone: nothing at all — long-press is the
      // browser's own word selection with the system 全选/拷贝 callout. A
      // programmatic select-all could not summon that menu reliably on
      // every iOS version, so the native gesture IS the feature.
      if(isPC) attachMenu(bubble, it, null);
    } else {
      const card = document.createElement('div');
      card.className = 'file-card';
      if(it.pending){ card.dataset.pending = '1'; card.classList.add('pending'); }
      const isImg = !it.pending && isImgName(it.name);
      const isVid = !it.pending && isVidName(it.name);

      // Preview bytes follow the long-press contract: the native media menu
      // (Safari loupe + 存储图像) saves img.src, so IMAGE cards pull the
      // ORIGINAL (/view) on both ends — the phone so "Save Image" stores real
      // bytes, the PC because it holds the file on disk and the pull is
      // loopback. VIDEO cards are exempt (see the isVid branch): pulling
      // video bytes for a thumbnail can cost hundreds of MB on an unlucky
      // file, so the timeline tile stays a blank play button until opened.
      // With the diff-render below a kept card never refetches; only a
      // genuine rebuild does. Undecodable formats (HEIC on old iOS) fail as
      // before: onerror drops the preview, the card falls back to its icon.
      if(isImg){
        card.classList.add('has-preview');
        const img = document.createElement('img');
        // No onload hook: the innerRO gravity already re-pins on every image
        // growth, and one pinning path beats two. onerror stays — a broken
        // image still falls back to its icon card.
        img.onerror = () => mediaFailed(card, it);
        img.src = '/view?id=' + encodeURIComponent(it.id) + '&ctx=card';
        img.alt = it.name;
        img.loading = 'lazy';
        // Preview opens from the media element ITSELF on both ends. The card
        // surface stays dead for media, so a long-press that lands on the
        // card's padding (not the image) cannot click-through into the
        // preview on release — on an ordinary webpage the padding is dead
        // too. Long-press ON the image is the browser's native menu.
        // stopPropagation: the card below also opens the preview (padding
        // taps), without it one tap would stack two overlays.
        img.onclick = (e) => { e.stopPropagation(); openPreview(it); };
        card.appendChild(img);
      } else if(isVid){
        card.classList.add('has-preview');
        // preload="none" and NO src: a timeline tile must never pull video
        // bytes (measured: ~1GB card traffic for one 500MB moov-at-end file
        // per open, zero taps). Bytes flow only on the explicit fullscreen
        // open, which autoplays. The tile is a fixed-ratio blank box (see
        // .vc-wrap CSS), so card heights are deterministic from the first
        // paint and there is no metadata wait at all.
        const wrap = document.createElement('div');
        wrap.className = 'vc-wrap';
        const v = document.createElement('video');
        v.preload = 'none';
        wrap.appendChild(v);
        const play = document.createElement('div');
        play.className = 'vc-play';
        play.innerHTML = '<span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>';
        wrap.appendChild(play);
        card.appendChild(wrap);
      } else {
        card.innerHTML = `<div class="fc-ico">${iconFor(it.name)}</div>`;
      }

      const info = document.createElement('div');
      info.className = 'fc-info';
      info.innerHTML = '<div class="fc-name"></div><div class="fc-size"></div>';
      info.querySelector('.fc-name').textContent = it.name;
      info.querySelector('.fc-size').textContent = fmtSize(it.size);
      if(it.pending){
        // Caption by WHAT IS MOVING, not by sender alone: a pending
        // from="phone" row is bytes crossing Wi-Fi (发送 on the phone, 接收
        // on the PC); a pending from="pc" row is a LOCAL copy into the inbox
        // — 导入 on the PC, and the phone shows nothing at all (it receives
        // nothing; its card appears when the copy graduates). The percent
        // lives in the corner ring on the copying end.
        info.querySelector('.fc-size').textContent +=
          ' · ' + (it.from === 'pc' ? '导入中…' : (mine ? '发送中…' : '接收中…'));
      }
      card.appendChild(info);

      // Every file card gets a persistent corner button — Download on the
      // phone (handed to the browser's own downloader, which owns progress
      // and cancel), Reveal in Explorer on the PC. Which one is decided by
      // paintCorner on each idle repaint. The same corner hosts the transfer
      // ring where this end mirrors a receiving transfer (PC only).
      const btn = document.createElement('button');
      btn.className = 'dlcardbtn hidden';
      btn.type = 'button';
      btn.onclick = (e) => { e.stopPropagation(); transferClick(it); };
      card.appendChild(btn);
      const ring = document.createElement('div');
      ring.className = 'cardring';
      ring.innerHTML = '<svg viewBox="0 0 30 30">'
        + '<circle class="cr-track" cx="15" cy="15" r="12" pathLength="100"/>'
        + '<circle class="cr-arc" cx="15" cy="15" r="12" pathLength="100"/>'
        + '</svg><span class="cr-glyph"></span>';
      // Ring is only shown while something is moving; tapping it dispatches to
      // whichever stop the local device owns (see ringTap).
      ring.onclick = (e) => { e.stopPropagation(); ringTap(it); };
      card.appendChild(ring);

      // Media on both ends opens the instant in-app preview (bytes are
      // already at hand — no reason to cold-start an external viewer for a
      // first glance). On the PC the overlay carries a "用默认应用打开"
      // button for the full viewer; other file types still shell out
      // directly since no in-app viewer beats their native app.
      if(isImg || isVid){
        card.onclick = () => {
          if(it.pending) return;                          // still uploading
          openPreview(it);
        };
      } else if(isPC){
        card.onclick = () => {
          if(it.pending) return;                          // still uploading
          openDefault(it);
        };
      } else {
        card.onclick = () => {
          if(it.pending) return;                          // still uploading
          // Phone tap = "show it", exactly like tapping a file link on an
          // ordinary webpage: the browser decides — its inline viewer for
          // PDF/text, its own download flow (with its own progress UI) for
          // anything else. The corner button stays the explicit download.
          location.href = '/view?id=' + encodeURIComponent(it.id) + '&ctx=nav';
        };
      }
      // The app's long-press menu is a PC affordance only (right-click). On
      // the phone the long-press gesture is handed to the browser's native
      // media menu on cards, and is simply dead on non-media files (their one
      // action, Download, lives on the corner button) — no 450ms timer, no
      // custom items, no suppression fighting the platform.
      if(isPC) attachMenu(card, it, bubble);
      bubble.appendChild(card);
    }

    const meta = document.createElement('div');
    meta.className = 'meta-line';
    meta.textContent = fmtTime(it.ts);

    bWrap.appendChild(bubble);
    bWrap.appendChild(meta);
    msg.appendChild(bWrap);
    return msg;
  } catch(err){
    // One bad message must not blank the whole timeline: report it and move on.
    reportClientError('render: skipped '+(it.name||it.text||'')+' ('+it.id+'): '+(err && err.message ? err.message : String(err)));
    return null;
  }
}

// Stick-to-bottom: a fresh window always opens pinned to the latest message
// (firstPaint — there is no saved position; the webview is rebuilt on every
// open), which is exactly what a chat app does: the newest message is what
// you came back to see. The hard part is late layout — at first paint every
// media box is 0px tall, then images decode/lazy-load, so the timeline keeps
// growing after the first scrollTop assign and a one-shot jump strands the
// view mid-list. The bottom is therefore a resting state held by gravity
// (innerRO below), not a jump to be timed right. Each media element also
// re-pins on load as backup. A manual scroll-up clears stickBottom, so
// reading history is never yanked.
let stickBottom = true;
let firstPaint = true;
// Causal order, no clocks: every pin and every user input takes a number;
// a non-bottom scroll position disarms only if the user did something AFTER
// our last pin (inputSeq > pinSeq). A pin's own late echo always loses that
// comparison, so it can never suicide stickiness no matter how noisy the
// boot layout is. Any order of echo vs input converges: continuous user
// input always outnumbers the single echo per pin.
let seq = 0, pinSeq = 0, inputSeq = 0;
function pinToBottom(){
  pinSeq = ++seq;
  $('chat').scrollTop = $('chat').scrollHeight;
}
// Gravity, not chase: the observer fires after EVERY content growth the inner
// undergoes — image decode, font swap, anything future — at any time, with no
// window to tune and no 2s cap to outrun. Pinning only ever sets scrollTop;
// it never resizes anything, so the loop cannot feed itself. When the user
// scrolls up, stickBottom is false and growth is correctly ignored, leaving
// scroll anchoring to hold their reading position.
const innerRO = new ResizeObserver(() => { if(stickBottom) pinToBottom(); });
innerRO.observe($('chatInner'));
// The phone's toolbar collapse changes the viewport height after load; a pin
// taken against the pre-collapse viewport sits slightly high. Re-pin on any
// viewport resize while parked at the bottom.
function repinOnResize(){ if(stickBottom) pinToBottom(); }
window.addEventListener('resize', repinOnResize);
if(window.visualViewport) window.visualViewport.addEventListener('resize', repinOnResize);
// Unseen-below counter backing the jump-to-latest button: render() bumps it by
// the number of genuinely new cards (appends only — in-place rebuilds and
// deletes don't count), a manual scroll back to the bottom clears it.
let unseenCount = 0;
function showToBottom(){
  const c = $('toBottomCount');
  c.textContent = unseenCount > 99 ? '99+' : String(unseenCount);
  c.classList.toggle('show', unseenCount > 0);
  $('toBottom').classList.add('show');
}
function hideToBottom(){
  unseenCount = 0;
  $('toBottomCount').classList.remove('show');
  $('toBottom').classList.remove('show');
}
$('toBottom').onclick = () => { pinToBottom(); hideToBottom(); };
// Any user input takes a sequence number (capture: it precedes the scroll it
// causes). Scrollbar drags, keys and menu clicks all count — direction is
// irrelevant, because disarming still requires a non-bottom position below.
['wheel', 'touchmove', 'touchstart', 'keydown', 'mousedown'].forEach(ev =>
  document.addEventListener(ev, () => { inputSeq = ++seq; }, { passive: true, capture: true }));
$('chat').addEventListener('scroll', () => {
  const c = $('chat');
  if(c.scrollTop + c.clientHeight >= c.scrollHeight - 32){
    stickBottom = true; hideToBottom();
  } else if(inputSeq > pinSeq){
    stickBottom = false;
  }
  // else: off-bottom with no input since our last pin — a layout echo
  // (growth between the pin and its event), not the user. Ignore it.
}, { passive: true });

function render(items){
  const chat = $('chat');
  const inner = $('chatInner');
  const wasAtBottom = chat.scrollTop + chat.clientHeight >= chat.scrollHeight - 32;

  // The boot placeholder (#boot) dies on the first real paint, whichever
  // branch: it must never survive next to real cards, and the true empty
  // state below is only ever painted from a confirmed-empty list.
  const bootEl = document.getElementById('boot');
  if(bootEl) bootEl.remove();

  if(!items.length){
    inner.replaceChildren();
    if(!document.getElementById('empty')) inner.appendChild(buildEmpty());
    return;
  }
  const emptyEl = document.getElementById('empty');
  if(emptyEl) emptyEl.remove();

  // Diff against what is on screen: ids still rendered are kept (never
  // touched), changed ids are rebuilt in place, new ids are appended, and
  // survivors of the kept map at the end were deleted on the server.
  const kept = new Map();
  for(const el of inner.children) if(el.dataset.id) kept.set(el.dataset.id, el);

  let added = 0;
  for(const it of items){
    const sig = itemSig(it);
    const old = kept.get(it.id);
    if(old){
      kept.delete(it.id);
      if(old.dataset.sig === sig) continue;
      const el = buildMsg(it, false);
      if(!el) continue;
      el.dataset.sig = sig;
      old.replaceWith(el);
      if(it.kind !== 'text') paintCorner(it.id);
    } else {
      added++;
      const el = buildMsg(it, true);
      if(!el) continue;
      el.dataset.sig = sig;
      inner.appendChild(el);
      if(it.kind !== 'text') paintCorner(it.id);
    }
  }
  for(const el of kept.values()) el.remove();

  // Pin here for the synchronous case; the innerRO gravity below holds it
  // across every late growth afterwards, so there is no window to tune.
  if(firstPaint || wasAtBottom) pinToBottom();
  else if(added > 0){ unseenCount += added; showToBottom(); }
  firstPaint = false;
}

async function openDefault(it){
  const res = await api('/open', { method:'POST', query:{ id: it.id } });
  if(!res.ok) toast('文件不存在');
}

// Downloads are NATIVE-ONLY: every file is handed to the browser's own
// downloader (it writes to real disk and shows its own progress). The in-app
// ring below is the PC's receiver ring for pushes arriving from phones (see
// the corner block). There is no JS chunk/OPFS downloader anymore — that
// engine was removed.
// No sender-side delivery marker on the card: cloud drives and transfer
// tools do not badge the sender's file with "downloaded at HH:MM" either —
// receipt is the receiver's own UI to confirm. The download-done fact lives
// in the server log only.
// Optimistic upload cards: when the phone picks a file it appears immediately on
// its own timeline as "Uploading…" before the server's pending row lands.
const optUploads = [];
let optSeq = 0;
function withOptimistic(serverItems){
  if(isPC || !optUploads.length) return serverItems;
  // Count real rows per name|size instead of a boolean: the same file can be
  // picked twice in parallel, and each real pending row covers exactly one
  // optimistic card — a boolean map would drop the twin's card the moment the
  // first row lands.
  const counts = {};
  for(const it of serverItems) if(it.from === 'phone'){
    const k = it.name + '|' + it.size;
    counts[k] = (counts[k] || 0) + 1;
  }
  const out = serverItems.slice();
  for(const o of optUploads){
    const k = o.name + '|' + o.size;
    if(counts[k] > 0){ counts[k]--; continue; }   // a real row already covers it
    out.push({ id: o.id, ts: String((o.at / 1000) | 0), from: 'phone', kind: 'file',
      name: o.name, size: o.size, source_kind: 'remote', pending: true, text: '' });
  }
  return out;
}

// ---- Corner transfer ring ----------------------------------------------
// Rings are drawn by the RECEIVER of a transfer, and only it can cancel:
//   PC        — the receiver of phone pushes: its ring rides the server's
//               received-byte counter (`progress` events for the pending row)
//               and its ✕ is the refuse affordance (/cancel).
//   Phone     — the receiver of pulls, whose progress and cancel live entirely
//               in the browser's own download UI; the page keeps NO transfer
//               state at all — no rings, no mirrors, nothing to sync. Its own
//               uploads are sender-side: the optimistic "Uploading…" card is
//               the feedback, and completion arrives as the row turning real.
// Sender-side feedback on the PC (a file being pulled away) is the coarser
// DlState card pulse further down — deliberately not a ring, since this end
// can neither see the pull's percent nor cancel it.
const progCache = {};   // id -> {sent,total,t} latest server snapshot (uploads)
const doneIds = {};     // transfers already flashed complete -> corner stays idle
const hideTimers = {};  // per-id "hide the finished ring" timers
function itemById(id){ for(const it of curItems) if(it.id === id) return it; return null; }
const BTN_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
// The PC corner's idle occupant: reveal the file's folder — it is the file's
// source, so its useful idle action is jumping to the location.
const BTN_FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>';
// The ring's only glyph is the completion check (Chrome's download-chip
// pattern); cancel is the center ✕ text.
const GLYPH_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

// What a card's corner should show right now:
//   null -> idle (no transfer) — the Download button may show instead
//   {pct, done} -> a live transfer — draw the ring at pct%
// `done` is true only on the tick the counter crosses 100%, so the caller can
// flash a full ring once before going idle again.
function cornerState(id){
  const it = itemById(id);
  if(!it || it.kind !== 'file') return null;
  // Only the receiver draws, and on this page the receiver is the PC for
  // every pending row: a phone push (bytes crossing Wi-Fi land here) and the
  // PC's own drag-in copy (bytes land here from the source disk) alike. Pulls
  // draw nothing here — the puller's browser owns that UI — and the sending
  // phone draws nothing either (sender-side).
  if(!isPC || !it.pending) return null;
  const prog = progCache[id];
  const total = (prog && prog.total) || it.size || 1;
  const sent = prog ? Math.min(prog.sent, total) : 0;
  return { pct: total ? sent / total * 100 : 0,
           done: !!(prog && total > 0 && prog.sent >= total) };
}

// Paint one card's corner: the ring while a transfer this end mirrors is
// live, the end's persistent action button otherwise (Download on the phone,
// Reveal in Explorer on the PC). Called after every render (cards were
// rebuilt) and on every `progress` tick; idle cards early-return so cost
// scales with activity.
function paintCorner(id){
  const card = document.querySelector('.msg[data-id="'+id+'"] .file-card');
  if(!card) return;
  const ring = card.querySelector('.cardring');
  const btn = card.querySelector('.dlcardbtn');
  if(!ring || !btn) return;
  let st = cornerState(id);
  // A completion that was already flashed is idle now, not a ring to re-show.
  if(st && st.done && doneIds[id]) st = null;

  if(!st){
    ring.classList.remove('show', 'done', 'p0');
    card.classList.remove('transferring');
    if(!card.dataset.pending){
      // The corner's idle occupant is a persistent action button on both
      // ends, each pointing at what that end can do with the file: the PC
      // (the file's source) reveals its folder; the phone re-downloads
      // through its browser (Files/Downloads dir). Uniform on every card
      // including images: the Files destination is a real need (originals,
      // re-sharing), and per-type exceptions only puzzle. Both yield the
      // corner only to a receiver-side ring, so each never gets hidden by
      // the transfers the other end runs.
      if(isPC){
        btn.classList.remove('hidden');
        btn.innerHTML = BTN_FOLDER;
        btn.title = '在资源管理器中显示';
      } else {
        btn.classList.remove('hidden');
        btn.innerHTML = BTN_DL;
        btn.title = '下载';
      }
      return;
    }
    btn.classList.add('hidden');
    return;
  }

  // Transferring: the ring owns the corner and the button hides. The card drops
  // its idle pulse so the ring is the only motion signal.
  btn.classList.add('hidden');
  card.classList.add('transferring');
  ring.classList.add('show');
  ring.classList.toggle('done', !!st.done);
  const p = Math.max(0, Math.min(100, st.pct));
  // A zero-length dash with round caps would paint a stray dot at 0% — hide
  // the arc there instead (class p0) and let the glyph say "started".
  ring.classList.toggle('p0', !(p > 0));
  ring.querySelector('.cr-arc').style.strokeDasharray = p + ' ' + (100 - p);
  // The number lives in the tooltip, not on the ring.
  ring.title = Math.round(p) + '%';
  // Center carries state: a big ✕ (this page IS the receiver — refuse the
  // push) while moving; a green check at completion.
  const glyph = ring.querySelector('.cr-glyph');
  glyph.classList.toggle('stop', !st.done);
  if(st.done){
    glyph.innerHTML = GLYPH_DONE;
  } else {
    glyph.innerHTML = '';
    glyph.textContent = '✕';
  }

  if(!st.done && hideTimers[id]){ clearTimeout(hideTimers[id]); hideTimers[id] = null; }
  if(st.done && !doneIds[id]){
    // Crossed 100%: hold the check a beat, then go idle.
    doneIds[id] = true;
    hideTimers[id] = setTimeout(() => paintCorner(id), 1200);
  }
}

// render() rebuilt the DOM and wiped every corner; bring back the rings of any
// card that is still mid-transfer.
function repaintTransfers(){
  for(const it of curItems){
    if(it.kind === 'file') paintCorner(it.id);
  }
}

// Corner-button action: the phone hands the file to the browser's native
// downloader, every time — no guards and no mirror, an in-flight pull is the
// browser's business (its own UI shows progress and cancel), and a second tap
// simply starts another download. The PC's counterpart is revealing the
// file's folder.
function transferClick(it){
  if(it.pending) return;                 // still uploading, nothing to act on
  if(isPC){ revealItem(it); return; }
  downloadFile(it);
}

// PC host action: refuse the incoming push for this id. The server flags the
// id (the upload writer tears down on its next chunk, dropping the pending row
// and the partial file) and we clear the local mirror so the ring vanishes
// right away.
async function stopTransfer(id){
  try { await api('/cancel', { method:'POST', query:{ id } }); } catch {}
  clearMirror(id);
}
// Drop this end's mirror of one transfer (counter, flash timers).
function clearMirror(id){
  delete progCache[id];
  delete doneIds[id];
  if(hideTimers[id]){ clearTimeout(hideTimers[id]); hideTimers[id] = null; }
  paintCorner(id);
}
// Corner-ring tap: this page draws only its own receiving uploads, so a tap
// is always "refuse this push". The phone draws no rings at all.
function ringTap(it){
  if(isPC){ stopTransfer(it.id); }
}
function checkUploadGone(items){
  for(const up of inFlightUploads){
    const mine = items.filter(i => i.from === 'phone'
      && i.name === up.name && i.size === up.size);
    if(mine.some(i => i.pending)){ up.seen = true; continue; }
    if(!mine.length && up.seen){
      // Refused by the receiver: abort locally so we stop streaming into the
      // socket the server is already tearing down. The failure toast is the
      // same "Transfer failed" whichever path wins the race.
      up.seen = false;
      up.ac.abort();
    } else {
      up.seen = mine.length > 0; // completed (row kept) or not seen yet
    }
  }
}

// Fullscreen media preview for image/video, both ends: the bytes are already
// at hand (the card pulled /view), so this is instant where ShellExecuteing
// an external viewer costs a cold start. The fullscreen layer deliberately
// keeps the BROWSER's native long-press callout: it shows the ORIGINAL bytes,
// so the platform's "Save Image" / "Download" / share sheet operates on the
// real photo — the one place where native menus are both natural and
// byte-correct. PC-only second step: a pill button shells out to the system
// default viewer (openDefault → /open) for zoom/edit and for formats whose
// native app beats any in-app view.
function openPreview(it){
  if(!isImgName(it.name) && !isVidName(it.name)) return;   // only media previews
  const isVid = isVidName(it.name);
  const ov = document.createElement('div');
  ov.className = 'media-ov';
  const src = '/view?id='+encodeURIComponent(it.id)+'&ctx=full';
  // NOTE: parens are load-bearing — ?: binds looser than +, without them the
  // video branch would swallow the buttons below (overlay with no ✕, then a
  // null.onclick throw before appendChild, i.e. tap does nothing at all).
  ov.innerHTML = (isVid
    ? '<video src="'+src+'" controls autoplay playsInline></video>'
    : '<img src="'+src+'">')
    + '<button class="mo-close" aria-label="关闭">'
    + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    + '</button>'
    + (isPC ? '<button class="mo-open">用默认应用打开</button>' : '');
  // Image: any tap dismisses (the whole layer IS the photo). Video: only the
  // backdrop or the ✕ dismisses — taps on the video itself must reach the
  // native controls (play/pause/seek), not close the layer under the finger.
  ov.onclick = (e) => { if(!isVid || e.target === ov) ov.remove(); };
  ov.querySelector('.mo-close').onclick = (e) => { e.stopPropagation(); ov.remove(); };
  if(isPC) ov.querySelector('.mo-open').onclick = (e) => { e.stopPropagation(); openDefault(it); };
  document.body.appendChild(ov);
}

// Phone "download": hand every file to the browser's own downloader, which
// writes to real disk with system-managed memory and resume, and shows the OS's
// own progress ring. Browsers require a user gesture to start a download — the
// corner tap is that gesture, which is also why a PC push never auto-downloads
// on the phone.
function downloadFile(it){
  nativeDownload(it);
}

// Native download: hand the file to the browser's own downloader — it owns
// progress, cancel and error UI, so the page keeps no state at all. Every tap
// is a fresh full GET, and the server keys each pull to its own per-request
// counter ("msg#n" in serve()), so parallel pulls — same file or not — are
// independent and cancelling one never disturbs the others.
function nativeDownload(it){
  const f = document.createElement('iframe');
  f.className = 'dlframe';
  f.style.display = 'none';
  f.src = '/dl?id='+encodeURIComponent(it.id)+'&r='+Date.now();
  document.body.appendChild(f);
  // One hidden trigger iframe per tap; once the response has started the pull
  // belongs to the browser's download manager, so reclaim the node after a
  // generous grace period instead of piling one up per download forever.
  setTimeout(() => f.remove(), 300000);
}

// Transfer snapshots arrive as `progress` SSE events (~1/s per upload) and a
// one-shot /dl-status resync on connect. Rings are receiver-side: the PC
// applies pushes for the pending rows it is receiving; download progress is
// never pushed (the puller's browser owns that UI) — the sending side's pull
// feedback is the coarser DlState card pulse below.
function syncProgress(list){
  if(!isPC) return;
  const now = Date.now();
  for(const d of list){
    const item = itemById(d.id);
    // Any pending row's ring paints on the PC: both a phone push AND the
    // PC's own drag-in copy stream progress pushes with this end as the
    // place where the bytes land.
    if(!item || !item.pending) continue;
    progCache[d.id] = { sent: d.sent, total: d.total, t: now };
    paintCorner(d.id);
  }
}

// ---- Sender-side download pulse (PC) --------------------------------------
// While any pull of a file is being served, the sending PC pulses its card —
// the symmetric counterpart of the sending phone's "Uploading…" pulse. The
// mirror is deliberately NOT a ring: a pull's cancel belongs to the puller's
// browser, so this end paints no ✕, no percent and no tap action — just
// "bytes are moving to someone".
//
// Union rule: the card stays lit until EVERY per-request transfer ("msg#n")
// of that file is complete or reaped, so cancelling one of two parallel pulls
// never darkens it while the other still runs. Live state arrives as `dlstate`
// SSE events (pushed at each transition: pull registered, one pull done or
// cut); a /dl-status snapshot rebuilds the whole set on (re)connect and on
// every `resync` — which is also the convergence path for a hard-dead pull
// (socket hung, no FIN): its entry lingers until the monitor's 5s silence
// prune, whose resync turns the pulse off then.
const dlActive = {};   // msg id -> some download of it is being served
function syncDlState(id, active){
  if(!isPC) return;
  if(active) dlActive[id] = true; else delete dlActive[id];
  paintDl(id);
}
// Rebuild the mirror from a /dl-status snapshot. Entries keyed "msg#n" are
// download transfers (uploads are keyed by their plain message id); an entry
// is active while incomplete — completed entries linger 15s in the snapshot
// and must not count.
function rebuildDlMirror(snap){
  if(!isPC) return;
  const active = {};
  for(const d of snap){
    const h = d.id.indexOf('#');
    if(h < 0) continue;                          // an upload counter, not a pull
    if(d.total > 0 && d.sent < d.total) active[d.id.slice(0, h)] = true;
  }
  for(const id of Object.keys(dlActive)) if(!active[id]){ delete dlActive[id]; paintDl(id); }
  for(const id of Object.keys(active)) if(!dlActive[id]){ dlActive[id] = true; paintDl(id); }
}
function paintDl(id){
  const card = document.querySelector('.msg[data-id="'+id+'"] .file-card');
  if(!card) return;
  const on = !!dlActive[id];
  card.classList.toggle('downloading', on);
  // Caption parity with the pending cards: "Uploading…"/"Receiving…" get one,
  // so "Sending…" rides the same fc-size line. The base text is cached on the
  // node; render() writes it fresh on every rebuild, so the cache never goes
  // stale.
  const size = card.querySelector('.fc-size');
  if(size){
    if(size.dataset.base === undefined) size.dataset.base = size.textContent;
    size.textContent = on ? size.dataset.base + ' · 发送中…' : size.dataset.base;
  }
}
// render() rebuilt the DOM and wiped the pulse classes; re-apply from the
// mirror. Runs right after repaintTransfers in applyList.
function repaintDownloads(){
  for(const it of curItems) if(it.kind === 'file') paintDl(it.id);
}

// Fetch the server's live-transfer snapshot, apply it, then reconcile the
// local mirrors with it: refresh counters for rows the server is still
// receiving, drop mirror state for ids it no longer tracks, and rebuild the
// download-pulse set. The server pushes nothing on a refused push or a
// dead-transfer prune — it broadcasts `resync` instead — so this reconcile is
// what lets a corner (and a pulse) return to idle instead of freezing on its
// last value forever.
async function resyncProgress(){
  let snap;
  try { snap = await (await api('/dl-status')).json(); } catch { return; }
  snap = snap || [];
  syncProgress(snap);
  reconcileMirrors(snap);
  rebuildDlMirror(snap);
  repaintTransfers();
  repaintDownloads();
}
function reconcileMirrors(snap){
  const known = new Set(snap.map(d => d.id));
  for(const id of Object.keys(progCache)) if(!known.has(id) && !doneIds[id]) delete progCache[id];
}

// Double-submit guard: the button used to stay enabled and the input uncleared
// until the server answered, so a slow response plus a second tap delivered
// the same text twice — two POSTs from two connections, two ids, and the
// server cannot tell them apart (every POST is a new message by design). One
// flight at a time; a failure keeps the text for retry.
let sending = false;
function sendText(){
  if(sending) return;
  const t = $('txt');
  const text = t.value.trim();
  if(!text) return;
  sending = true; updateSendBtn();
  api('/send-text', { method:'POST', body:{ text } }).then(r => {
    sending = false;
    if(r.ok){ t.value = ''; autoSize(); updateSendBtn(); }
    else { updateSendBtn(); toast('发送失败'); }
  }).catch(() => { sending = false; updateSendBtn(); toast('发送失败'); });
}

function autoSize(){
  const t = $('txt');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 100) + 'px';
}
function updateSendBtn(){
  $('send').disabled = sending || $('txt').value.trim().length === 0;
}

async function uploadFiles(files){
  if(!files.length) return;
  // Serial, smallest-first: on a LAN one stream already saturates the link,
  // so parallel streams only split the same pipe while contending radio/CPU
  // and risking a starved stream tripping the server's 5s silence kill.
  // Smallest-first keeps parallel's one real win (photos land before a 2GB
  // video) with none of its costs. One request per file still: each gets its
  // own ?size= (the per-request total the server declares on the pending row,
  // so the PC ring's percent is right), its own optimistic card, and its own
  // in-flight entry. A failure skips to the next file, never aborts the
  // queue; one summary toast covers the whole batch.
  const queue = [...files].sort((a, b) => (a.size || 0) - (b.size || 0));
  let ok = 0;
  for(const f of queue) if(await startUpload(f)) ok++;
  reapply();
  if(queue.length === 1) toast(ok ? '发送成功' : '传输失败');
  else toast(ok === queue.length ? `发送成功 ${ok}/${queue.length}` : `已发送 ${ok}/${queue.length}`);
}
// MIME-derived fallback for nameless uploads (see startUpload): keeps the
// server's filename, so cache keys and inbox names stay meaningful.
function fallbackName(f){
  const m = /^image\/([a-z0-9]+)/i.exec(f.type || '');
  return 'pasted-image.' + (m ? m[1].toLowerCase() : 'bin');
}
async function startUpload(f){
  const opt = { id: 'opt-' + (++optSeq), name: f.name, size: f.size || 0, at: Date.now() };
  // Draw the sending side's card immediately ("Uploading…") before the server
  // round-trips; withOptimistic() replaces it with the server's pending row as
  // soon as that arrives.
  optUploads.push(opt);
  const fd = new FormData();
  // Pasted clipboard images (long-press 拷贝 on a card, then paste into the
  // composer) often arrive with an EMPTY filename — Safari puts the image AND
  // its URL on the pasteboard, and the file half can be nameless. The server
  // rejects those with a 400 ("bad filename") and the user only sees 传输失败.
  // Name them here from the MIME type so the paste flow uploads like a file.
  fd.append('file', f, f.name || fallbackName(f));
  // The abort handle is what checkUploadGone pulls when the receiver refuses
  // the push: aborting cancels the request mid-stream, so the phone stops
  // writing bytes into a socket the server is already tearing down.
  const ac = new AbortController();
  const up = { ac, name: f.name, size: f.size || 0, seen: false };
  inFlightUploads.push(up);
  const finish = () => {
    const i = inFlightUploads.indexOf(up);
    if(i >= 0) inFlightUploads.splice(i, 1);
    const j = optUploads.indexOf(opt);
    if(j >= 0) optUploads.splice(j, 1);
    reapply();
  };
  // One boolean for every cause: a receiver-side refusal tears the socket
  // down before the row-vanish list event can arrive, so the client genuinely
  // cannot tell a refused push from a WiFi drop — over-precise toasts only
  // mislead (a refusal used to read "Network error"). The abort rejection and
  // a hard network error both land in the same catch, so the old
  // load/error/abort trio collapses into just success vs failure, and the
  // batch summary toast lives in uploadFiles.
  try {
    const r = await api('/upload', { method:'POST', body: fd, query:{ size: f.size || 0 } });
    finish();
    return r.ok;
  } catch {
    finish();
    return false;
  }
}

$('txt').addEventListener('input', () => { autoSize(); updateSendBtn(); });
// Paste-to-send on the composer: a screenshot on the PC, or an image copied
// from another app on the phone, sends immediately — the same flow as the
// plus button, no staging UI. Text-only pastes are untouched, and a
// <textarea> cannot render an image anyway, so intercepting the file
// representation is the only way it reaches the app. Nameless clipboard files
// are named from their MIME type in startUpload (Safari puts copied card
// images on the pasteboard without a name); pasting a card's own image just
// duplicates it as a new card — visible and deletable, the user's choice.
// Some mobile keyboards never offer 粘贴 for an image-only clipboard; there
// the plus button stays the path (failure mode = today's behavior, nothing
// lost).
$('txt').addEventListener('paste', e => {
  const files = [...(e.clipboardData ? e.clipboardData.files : [])];
  if(files.length){ e.preventDefault(); uploadFiles(files); }
});
$('txt').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
});
$('send').onclick = sendText;

$('inboxBtn').onclick = () => {
  api('/open-dir', {method:'POST'}).catch(()=>toast('无法打开收件箱'));
};

// Clear-all lives in the header, so it is PC-only the same way the inbox and
// QR tiles are (the whole bar hides on coarse pointers); the backend enforces
// PC-only again like /rm. Double-submit is harmless by construction: the
// second POST finds an empty index and answers "nothing to delete".
$('clearBtn').onclick = () => { $('clearOverlay').classList.add('show'); };
$('clearCancel').onclick = () => { $('clearOverlay').classList.remove('show'); };
$('clearConfirm').onclick = async () => {
  $('clearOverlay').classList.remove('show');
  try {
    const r = await api('/rm-all', {method:'POST'});
    toast(r.ok ? '已清空' : '清空失败');
  } catch { toast('清空失败'); }
  refresh();
};

// iOS quirk (observed on both Safari and Chrome via log traces): the OS picker
// service intermittently drops the presentation — showPicker()/click() are
// accepted without error, but no sheet appears and no change/cancel event ever
// fires. The next tap presents normally; nothing page-side can detect or fix
// the dropped one.
$('plus').onclick = () => {
  if(isPC){ pickLocal(); return; }
  try { $('fileInput').showPicker(); }
  catch { $('fileInput').click(); }
};
$('fileInput').addEventListener('change', e => {
  if(e.target.files.length) uploadFiles([...e.target.files]);
  e.target.value = '';
});

// Send real PC paths to /add-local (the plus button and PC drag-and-drop; the
// webview exposes the dropped file's path via the non-standard File.path). The
// server copies each one into the Inbox folder and only then adds its card, so a
// file appears in the timeline once the copy is done. A short dedup window
// absorbs the drop being delivered both as an HTML5 drop AND as the
// tauri://drag-drop event, so the file is not copied twice.
const recentLocal = new Map();
async function addLocalPaths(paths){
  if(!paths.length) return;
  const now = Date.now();
  const fresh = paths.filter(p => {
    const t = recentLocal.get(p);
    recentLocal.set(p, now);
    return !t || now - t > 5000;
  });
  if(!fresh.length) return;
  // The webview's fetch reuses pooled keep-alive sockets; after a long idle
  // the first POST can land in a socket the OS already dropped — "Failed to
  // fetch" with the request never reaching the server (the log proves it:
  // no /add-local line, only the unhandledrejection report). One silent
  // retry gets a fresh connection, which is exactly what a manual re-drop
  // did. Still loud after: a real failure toasts twice as hard.
  let r;
  try {
    r = await api('/add-local', { method:'POST', body:{ paths: fresh } });
  } catch {
    // The one observable trace of this bug class: count every silent retry
    // in the server log, so the stale-socket phenomenon goes from folklore
    // to a measurable frequency (the pool's own internals emit no events).
    reportClientError('add-local: first attempt failed to fetch (likely stale pooled socket), retrying');
    try {
      r = await api('/add-local', { method:'POST', body:{ paths: fresh } });
    } catch {
      toast('添加失败');
      return;
    }
  }
  if(!r.ok) toast('添加失败');
}
// Tauri fires tauri://drag-drop with the real paths in parallel with the HTML5
// drop. Listening to it covers platforms where the File.path injection is
// missing; addLocalPaths' dedup makes the double-delivery harmless.
if(isPC && window.__TAURI__ && window.__TAURI__.event){
  window.__TAURI__.event.listen('tauri://drag-drop', e => {
    const p = e.payload;
    if(p && Array.isArray(p.paths) && p.paths.length) addLocalPaths(p.paths);
  }).catch(()=>{});
}

async function pickLocal(){
  const T = window.__TAURI__;
  if(!T || !T.dialog || !T.dialog.open){
    $('fileInput').click(); return;
  }
  try {
    const picked = await T.dialog.open({ multiple: true, title: '选择文件' });
    if(!picked) return;
    let paths = [];
    if(Array.isArray(picked)) paths = picked.map(p => typeof p === 'string' ? p : p.path);
    else if(typeof picked === 'string') paths = [picked];
    else if(picked && picked.path) paths = [picked.path];
    addLocalPaths(paths);
  } catch(e) {
    toast('添加失败');
  }
}

// Drag and drop overlay. The overlay (and only it) is gated on the drag
// carrying real FILES: dragging a chat <img> around (long-press + move, esp.
// on iOS Safari) fires dragenter too, but its types are URL/HTML with an empty
// files list — showing 松手即发送 there is a lie (drop would no-op, and even
// if it carried bytes it would re-upload the server's own file). preventDefault
// stays unconditional so a stray drop can never navigate the page away.
function dragHasFiles(e){
  try { return [...(e.dataTransfer ? e.dataTransfer.types : [])].includes('Files'); }
  catch { return false; }
}
let dragCounter = 0;
const dOverlay = $('dragOverlay');
window.addEventListener('dragenter', e => {
  e.preventDefault();
  // Phone has no drag-upload at all: uploads ride the plus-button picker.
  // Letting drops/pastes through would only re-upload the server's own bytes
  // (a long-pressed card image) back to it under a made-up name. preventDefault
  // stays so a stray drop can never navigate the page away.
  if(!isPC) return;
  dragCounter++;
  if(dragHasFiles(e)) dOverlay.classList.add('active');
});
window.addEventListener('dragleave', e => {
  e.preventDefault();
  dragCounter--;
  if(dragCounter <= 0){
    dragCounter = 0;
    dOverlay.classList.remove('active');
  }
});
window.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
window.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  dOverlay.classList.remove('active');
  // Phone: every drop is swallowed, composer included. Drops of in-page
  // images carry broken file entries (multipart that never parses — the log
  // proves it: "upload rejected: multipart read"), so even the deliberate
  // composer-drop misfires into a 传输失败 toast. Uploads ride the
  // plus-button picker, full stop.
  if(!isPC) return;
  const files = [...e.dataTransfer.files];
  if(!files.length) return;
  // PC drag-and-drop behaves like the plus button: real paths go to /add-local,
  // which copies them into the Inbox locally (no network upload). Only falls
  // back to an upload when real paths are unavailable (e.g. the phone side).
  if(isPC){
    const paths = files.map(f => f.path).filter(p => typeof p === 'string' && p);
    if(paths.length === files.length){
      addLocalPaths(paths);
      return;
    }
  }
  uploadFiles(files);
});

// PC scan gate: shows full-screen until the FIRST LAN device connects this
// session (`everConnected` latches on the first `info` online and never
// resets), so it appears only before the first device — adding a later device
// is the header QR's job, not a re-shown gate.
//
// There is deliberately NO ambient link/connection light on either side. A
// status derived from heartbeat absence always lags reality by its detection
// window, in both directions ("why still green / why still red"), and an
// unreliable reference is worse than none. All connectivity feedback is
// therefore action-coupled: a send/download either succeeds or fails loudly in
// the moment. The SSE channel below still reconnects + replays state
// invisibly; it just never paints.
let everConnected = false;
// The first `info` is a replayed snapshot, not a transition: it latches the
// gate either way but never toasts. Only a later false->true flip (a device
// arriving under a live page) is a "newly paired" worth announcing — without
// this, every rebuilt window re-toasts for a phone that never left.
let seenInfo = false;
function applyInfo(d){
  if(!isPC || !d) return;
  const online = !!d.mobileConnected;
  if(seenInfo && online && !everConnected) toast('已配对,可以传输了');
  seenInfo = true;
  if(online) everConnected = true;
  // The gate is a pairing screen, not a splash: it never goes away by click.
  // The first LAN device arriving is the only thing that lifts it — which is
  // exactly the reported question "已连接了吗？" answered in one gesture.
  $('gate').classList.toggle('show', !everConnected);
  if(d.url){
    $('gateUrl').querySelector('span').textContent = d.url;
    $('qlUrl').textContent = d.url;
  }
  // First info lands: boot the held list (if any) so the first paint reveals
  // exactly one surface — the gate toggle above already chose which.
  if(!booted){
    booted = true;
    const l = bootList; bootList = null;
    if(l) applyListLive(l); else refresh();
  }
}

// Single SSE push channel: named events carry the actual state, so the page
// polls no state endpoints. On open the server replays list/fw/info (each
// carrying a 1s retry hint) and we additionally pull /list and /dl-status once
// to cover the replay race. This channel is pure transport maintenance: it
// reconnects, replays state and reconciles, but never paints any link UI (see
// the scan-gate comment above) — connectivity is judged by actions.
let es;
// Last time ANY SSE event arrived, heartbeats included. EventSource has no
// read timeout, so a server that dies without a FIN (PC asleep, hard crash)
// never fires `error`; the watchdog below uses event silence to force a fresh
// connection instead of trusting a half-open socket forever. Named events
// count too (kept true in every listener below): the server suppresses
// heartbeats while named events flow faster than 1/s (axum resets the
// keep-alive timer on every event), so counting heartbeats alone would read a
// busy, healthy stream as dead.
let lastSeen = 0;
// True while the channel is visibly failing (EventSource retrying on its own
// after an `error`); the watchdog then stands down — a retry loop is already
// probing, so closing/reopening would only double the churn.
let esDown = false;
function connect(){
  if(pairExpired) return;
  es = new EventSource('/events');
  // Observability: only the FIRST error is tagged into the server log — it
  // marks the moment JS discovered the link dead. onopen stays quiet: it fires
  // on every (re)connect including the watchdog's, and would only spam /log.
  es.onopen = () => { esDown = false; lastSeen = Date.now(); reconcile(); };
  es.onerror = () => { if(!esDown) reportClientError('es first error'); esDown = true; probePairing(); };
  // The server heartbeats as unnamed `message` events (see /events keep_alive);
  // this is the only hook that sees them.
  es.onmessage = () => { lastSeen = Date.now(); };
  es.addEventListener('list', e => { lastSeen = Date.now(); applyList(JSON.parse(e.data)); });
  es.addEventListener('progress', e => { lastSeen = Date.now(); syncProgress([JSON.parse(e.data)]); });
  // Sender-side pull activity (PC only): the card pulse tracks the union of
  // the file's live per-request transfers.
  es.addEventListener('dlstate', e => {
    lastSeen = Date.now();
    const d = JSON.parse(e.data);
    syncDlState(d.id, d.active);
  });
  // A `resync` means this client fell behind and may have dropped pushes (see
  // PushEvent::Resync for the full trigger list). Re-fetch BOTH the file list
  // and the transfer mirrors so nothing stays stale.
  es.addEventListener('resync', () => { lastSeen = Date.now(); reconcile(); });
  es.addEventListener('fw', e => { lastSeen = Date.now(); applyFw(JSON.parse(e.data).needRepair); });
  es.addEventListener('info', e => { lastSeen = Date.now(); applyInfo(JSON.parse(e.data)); });
}
// Home-screen web app contexts refuse service: since iOS 26 the add-to-Home-
// Screen flow installs every site as a web app by default (the "Open as Web
// App" toggle, on by default, is the user's — no site-side meta can opt out),
// and an app-window context has no download manager or browser chrome to hand
// /dl to. tinbox's download path rides the browser's downloader, so that
// context cannot work; surfacing the webAppGate card beats silent download
// failures there. Detection follows web.dev's canonical display-mode ladder,
// widened to every non-browser mode so the Chromium ends are covered too:
// standalone/minimal-ui match Android + desktop Chromium app windows,
// fullscreen covers Chrome Android fullscreen PWAs (its standalone report is
// unreliable — mdn/content#34928), window-controls-overlay covers desktop
// overlay windows, navigator.standalone is the iOS-only fallback, and the
// android-app:// referrer catches TWAs. With no manifest, an Android shortcut
// cannot enter any of these modes today, so those arms are pure defense in
// depth. atWebAppLive closes the runtime hole: desktop Chrome can transfer an
// open tab into a fresh app window AFTER load, flipping display-mode under a
// live page — and it omits fullscreen, because the Fullscreen API also flips
// display-mode to fullscreen at runtime (MDN), which is not an app window.
// The legacy apple-mobile-web-app-* metas stay retired: on older iOS they are
// what FORCED this context, on iOS 26 they are dead code either way.
const atWebApp = matchMedia('(display-mode: standalone), (display-mode: minimal-ui),'
  + ' (display-mode: fullscreen), (display-mode: window-controls-overlay)');
const atWebAppLive = matchMedia('(display-mode: standalone), (display-mode: minimal-ui),'
  + ' (display-mode: window-controls-overlay)');
const inWebApp = !isPC && (navigator.standalone === true
  || document.referrer.startsWith('android-app://')
  || atWebApp.matches);
if(inWebApp) $('webAppGate').classList.add('show');
else connect();
atWebAppLive.addEventListener('change', e => {
  if(!isPC && e.matches && !pairExpired){
    try { es.close(); } catch {}
    $('webAppGate').classList.add('show');
  }
});

// Pairing-expiry probe: EventSource never surfaces HTTP statuses, so a token
// rotated by a server restart looks identical to a dead server. Every SSE
// failure and every down-channel poll cycle checks /list once: a 403 answers
// at once and trips pairExpiredNow (the overlay replaces the stale snapshot
// within ~a retry delay, so an old tab never lingers as a "usable" main UI);
// a network failure (server still closed) is swallowed — the probe is also
// half of "watch for the PC coming back". The in-flight guard dedupes, since
// EventSource can fire `error` on a ~1s retry cadence.
let pairProbeInFlight = false;
function probePairing(){
  if(pairExpired || pairProbeInFlight) return;
  pairProbeInFlight = true;
  fetch('/list')
    .then(r => { if(r.status === 403) pairExpiredNow(); })
    .catch(() => {})
    .finally(() => { pairProbeInFlight = false; });
}

// One reconcile pass: everything that can fall behind re-pulls both mirrors.
// Driven by the `resync` event, a (re)connect and a return to the foreground —
// never by per-state timers.
function reconcile(){
  probePairing();       // 403 is asked before anything else refreshes: the
                        // overdue overlay must not wait for the probe interval.
  if(pairExpired) return;
  refresh();
  resyncProgress();
}

// Watchdog: the server heartbeats every 1s when the stream is idle, and any
// named event also proves the link alive (see lastSeen above), so >3s of total
// silence with the channel NOT already failing means the socket is half-open —
// EventSource will never notice on its own. Force a fresh connection; its
// `open` replays state.
setInterval(() => {
  if(pairExpired) return;
  if(!esDown && lastSeen && Date.now() - lastSeen > 3000){
    lastSeen = Date.now();
    try { es.close(); } catch {}
    connect();
  }
}, 1000);

// A backgrounded phone/browser can have its EventSource suspended (Chrome keeps
// it "open" but delivers nothing), so on return to the foreground there is no
// new SSE event to nudge a refresh. Reconcile here.
document.addEventListener('visibilitychange', () => {
  // Quiet by design: every lock/unlock would otherwise POST /log.
  if(document.visibilityState === 'visible') reconcile();
});

let fwWasShown = false;
// Firewall repair flag arrives as an SSE `fw` event (the server pushes only on
// change); no /fw-status polling. The flag means the firewall would block the
// phone on some network — either an applicable Block rule exists, or the Allow
// rules do not cover every network type (the dialog's Allow is scoped to the
// category active at answer time). The overlay is PREVENTIVE: it may appear
// while the current network still works, because the next network change
// would break connectivity. There is no dismiss: the fix is one UAC prompt,
// and after it the all-profile Allow makes the issue permanent-impossible.
function applyFw(needRepair){
  const show = !!needRepair;
  $('fwOverlay').classList.toggle('show', show);
  if(fwWasShown && !show){
    // The worker (or connection evidence) just cleared the flag — the fix
    // landed. The success toast lives HERE, not in the repair click: the
    // repair return only means "UAC granted", the confirmation is this
    // transition.
    api('/untop', {method:'POST'}).catch(()=>{});
    toast('网络访问已恢复');
  }
  fwWasShown = show;
}
$('fwRepair').onclick = async () => {
  $('fwRepair').disabled = true;
  $('fwQuit').disabled = true;
  $('fwHint').textContent = '请在弹窗中确认管理员授权(UAC)…';
  try {
    const r = await api('/repair', {method:'POST'});
    const txt = await r.text();
    if(txt.trim() === 'ok'){
      // The launcher is spawned — the UAC prompt (if any) is on screen now.
      // The fix is confirmed by the fw worker within ~1s of the rules
      // landing: applyFw(false) closes this overlay. If the UAC prompt is
      // cancelled, nothing changes and clicking Allow retries.
      $('fwHint').textContent = '已发起授权,确认后此弹窗会自动关闭。';
    } else {
      $('fwHint').textContent = '未获授权,请点击“允许”重试。';
    }
  } catch(e) {
    $('fwHint').textContent = '请求失败,请重试';
  }
  $('fwRepair').disabled = false;
  $('fwQuit').disabled = false;
};
$('fwQuit').onclick = () => { api('/quit', {method:'POST'}).catch(()=>{}); };

// QR lightbox: the small header QR opens a large scan-ready version on click.
// Closing is explicit — the card's ✕ button or the Escape key; the backdrop
// does not swallow clicks (no accidental dismissal when a stray click lands
// beside the card).
function openQrLightbox(){ $('qrLightbox').classList.add('show'); }
function closeQrLightbox(){ $('qrLightbox').classList.remove('show'); }
$('qrBox').onclick = openQrLightbox;
$('qlClose').onclick = closeQrLightbox;
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeQrLightbox(); $('clearOverlay').classList.remove('show'); }
});

if(isPC){
  // The OS title bar already brands the window (icon + "tinbox") immediately
  // above the page header; painting the brand twice in 60px of vertical space
  // is duplication. The phone keeps its in-page brand — mobile browsers give
  // a page almost no identity chrome of its own, so the header logo is the
  // only branding surface there.
  document.querySelector('.brand').style.display = 'none';
  // The gate is driven by the first `info` event (a replayed snapshot), never
  // shown by default: a rebuilt window with a live phone must land straight
  // on the timeline instead of flashing the QR gate. It hides once the first
  // device connects (everConnected latches inside applyInfo) and never comes
  // back after that. There is NO manual escape: the gate is the pairing
  // screen, and pairing is the only way to the in-app timeline. The Inbox
  // button is a real folder — the transfer landing zone on disk — and
  // nothing else. The first paint is atomic with the timeline (see the boot
  // gate at applyList): the list waits for this first info, so neither
  // surface ever flashes before the other. The timeout below is the fallback
  // for a silent channel.
  setTimeout(() => {
    if(seenInfo || booted) return;
    // Silent channel: boot with whatever list arrived (or none — refresh()
    // re-fetches inside the boot step) and fall back to the gate, the same
    // surface a failed info would have chosen.
    booted = true;
    $('gate').classList.add('show');
    const l = bootList; bootList = null;
    if(l) applyListLive(l); else refresh();
  }, 3000);
}

// Report client-side exceptions into the server log, so a failure on the phone
// (where tinbox.log is not directly readable) still lands in tinbox.log with a
// "client:" prefix. Every line carries a monotonic sequence number, so a lost
// POST (e.g. a fetch that loses the unfreeze race right after a page wakes and
// its catch swallows the failure) shows up as a visible gap instead of a
// silent hole. One silent retry on a fresh connection — same decision tree as
// add-local.
let clientLogSeq = 0;
function reportClientError(msg){
  const tag = '#' + (++clientLogSeq) + ' ' + msg;
  api('/log', { method:'POST', body:{ msg: tag } }).catch(() => {
    setTimeout(() => {
      api('/log', { method:'POST', body:{ msg: tag + ' (retry)' } }).catch(()=>{});
    }, 1000);
  });
}
window.addEventListener('error', e => {
  reportClientError((e.message || 'unknown error') + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
});
window.addEventListener('unhandledrejection', e => {
  const r = e.reason;
  const msg = (r && (r.message || r.toString())) || String(r);
  reportClientError('unhandledrejection: ' + msg);
});

refresh();
</script>
</body>
</html>
