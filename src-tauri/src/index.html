});

// Pairing arrival toast (PC): `everOnline` latches on the first `info`
// online and never resets, so the toast fires only for a device arriving
// under a live page — adding a later device is the header QR's job, not a
// re-shown gate (there is none: the timeline paints paired or not).
//
// There is deliberately NO ambient link/connection light on either side. A
// status derived from heartbeat absence always lags reality by its detection
// window, in both directions ("why still green / why still red"), and an
// unreliable reference is worse than none. All connectivity feedback is
// therefore action-coupled: a send/download either succeeds or fails loudly in
// the moment. The SSE channel below still reconnects + replays state
// invisibly; it just never paints.
let everOnline = false;
// The first `info` is a replayed snapshot, not a transition: it latches
// either way but never toasts. Only a later false->true flip (a device
// arriving under a live page) is a "newly paired" worth announcing — without
// this, every rebuilt window re-toasts for a phone that never left.
let seenInfo = false;
let qrUrl = null;      // last USABLE url this lifecycle (kept across no-network gaps); a differing new one = stale code
let lanUsable = true;  // false = no LAN address, so there is no code to show
function applyInfo(d){
  if(!isOwner || !d) return;
  const online = !!d.mobileConnected;
  if(seenInfo && online && !everOnline){
    toast('连接成功，可以传输了');
    // The phone just arrived: dismiss the card if it is open. closeQrLightbox
    // is guarded, so a card that is already closed is left alone — a device
    // pairing must not silently retire an unread cue the user never looked at.
    closeQrLightbox();
  }
  seenInfo = true;
  if(online) everOnline = true;

  const usable = d.usable !== false;
  const wasUsable = lanUsable;
  // Within this app lifecycle, remember the last USABLE url and never forget it
  // across a no-network gap: a real network switch is A -> none -> B, so the
  // comparison has to survive the gap or the cue never fires. "Usable url
  // differs from the previous usable url" == a second, different code was drawn
  // -> the phone's old one is dead -> "rescan" (warning text + button dot).
  // Returning to the SAME url after a drop is a reconnect, not a change, so it
  // stays quiet. qrUrl only ever holds a usable url, so the no-LAN 127.0.0.1
  // placeholder can never masquerade as a previous code.
  const urlChanged = !!d.url && usable && qrUrl !== null && qrUrl !== d.url;
  const recovered = usable && !wasUsable;

  if(d.url) $('qlUrl').textContent = d.url;
  if(usable && d.url) qrUrl = d.url;

  // Two states drive the card: usable (show the current code) / no LAN (show
  // the explanation). The unread cue is ONE entity with two surfaces — the
  // button dot while the card is closed, the warning text while it is open —
  // set together here and cleared together when the card closes or on no LAN.
  $('qrLightbox').classList.toggle('no-lan', !usable);
  if(!usable){
    $('qrImg').removeAttribute('src');
    $('qrLightbox').classList.remove('net-changed');
    $('connectBtn').classList.remove('alert');
  } else {
    if(urlChanged){
      $('connectBtn').classList.add('alert');
      $('qrLightbox').classList.add('net-changed');
    }
    // The card's image must never disagree with the state: when an OPEN card is
    // looking at a superseded code — a usable change (A->B) or a recovery
    // (none->LAN) — swap in the fresh one now. A closed card fetches on open.
    if((urlChanged || recovered) && $('qrLightbox').classList.contains('show')){
      loadQr('/qr?r=' + Date.now());
    }
  }
  lanUsable = usable;
}

// Single SSE push channel: named events carry the actual state, so the page
// polls no state endpoints. On open the server replays list/fw/info (each
// carrying a 1s retry hint) and we additionally pull /list and /dl-status once
// to cover the replay race. This channel is pure transport maintenance: it
// reconnects, replays state and reconciles, but never paints any link UI (see
// the arrival-toast comment above) — connectivity is judged by actions.
let es;
// Last time ANY SSE event arrived, heartbeats included. EventSource has no
// read timeout, so a server that dies without a FIN (PC asleep, hard crash)
// never fires `error`; the watchdog below uses event silence to force a fresh
// connection instead of trusting a half-open socket forever. Named events
// count too (kept true in every listener below): the server suppresses
// heartbeats while named events flow faster than 1/s (axum resets the
// keep-alive timer on every event), so counting heartbeats alone would read a
// busy, healthy stream as dead.
let lastSeen = 0;
// True while the channel is visibly failing (EventSource retrying on its own
// after an `error`); the watchdog then stands down — a retry loop is already
// probing, so closing/reopening would only double the churn.
let esDown = false;
function connect(){
  if(pairExpired) return;
  es = new EventSource('/events');
  // Observability: only the FIRST error is tagged into the server log — it
  // marks the moment JS discovered the link dead. onopen stays quiet: it fires
  // on every (re)connect including the watchdog's, and would only spam /log.
  es.onopen = () => { esDown = false; lastSeen = Date.now(); reconcile(); };
  es.onerror = () => { if(!esDown) reportClientError('es first error'); esDown = true; probePairing(); };
  // The server heartbeats as unnamed `message` events (see /events keep_alive);
  // this is the only hook that sees them.
  es.onmessage = () => { lastSeen = Date.now(); };
  es.addEventListener('list', e => { lastSeen = Date.now(); applyList(JSON.parse(e.data)); });
  es.addEventListener('progress', e => { lastSeen = Date.now(); syncProgress([JSON.parse(e.data)]); });
  // A `resync` means this client fell behind and may have dropped pushes (see
  // PushEvent::Resync for the full trigger list). Re-fetch BOTH the file list
  // and the transfer mirrors so nothing stays stale.
  es.addEventListener('resync', () => { lastSeen = Date.now(); reconcile(); });
  es.addEventListener('fw', e => { lastSeen = Date.now(); applyFw(JSON.parse(e.data).needRepair); });
  // UAC outcome for an in-flight repair (see applyFwPhase): the frontend
  // cannot see the UAC prompt, so the backend reports "granted" once the
  // elevated script proves it is running.
  es.addEventListener('fwrepair', e => { lastSeen = Date.now(); applyFwPhase(JSON.parse(e.data).phase); });
  es.addEventListener('info', e => { lastSeen = Date.now(); applyInfo(JSON.parse(e.data)); });
  // Fresh pairing (QR scan / hand-typed URL): the one exact pairing moment —
  // unlike `info`, which is a sampled presence bit. Toast every time, even if
  // the phone never left (a scan is always worth confirming), and dismiss the
  // QR lightbox — its job is done, no ✕ click needed. Latch everOnline so the
  // presence flip that follows the scan doesn't double-toast.
  es.addEventListener('paired', () => {
    lastSeen = Date.now(); everOnline = true;
    toast('连接成功，可以传输了');
    // Dismiss the card if it is open (the scan just used it). closeQrLightbox
    // is guarded, so a card that is already closed is untouched: pairing never
    // retires an unread cue the user has not looked at.
    closeQrLightbox();
  });
}
// Home-screen web app contexts refuse service: since iOS 26 the add-to-Home-
// Screen flow installs every site as a web app by default (the "Open as Web
// App" toggle, on by default, is the user's — no site-side meta can opt out),
// and an app-window context has no download manager or browser chrome to hand
// /dl to. tinbox's download path rides the browser's downloader, so that
// context cannot work; surfacing the webAppGate card beats silent download
// failures there. Detection follows web.dev's canonical display-mode ladder,
// widened to every non-browser mode so the Chromium ends are covered too:
// standalone/minimal-ui match Android + desktop Chromium app windows,
// fullscreen covers Chrome Android fullscreen PWAs (its standalone report is
// unreliable — mdn/content#34928), window-controls-overlay covers desktop
// overlay windows, navigator.standalone is the iOS-only fallback, and the
// android-app:// referrer catches TWAs. With no manifest, an Android shortcut
// cannot enter any of these modes today, so those arms are pure defense in
// depth. atWebAppLive closes the runtime hole: desktop Chrome can transfer an
// open tab into a fresh app window AFTER load, flipping display-mode under a
// live page — and it omits fullscreen, because the Fullscreen API also flips
// display-mode to fullscreen at runtime (MDN), which is not an app window.
// The legacy apple-mobile-web-app-* metas stay retired: on older iOS they are
// what FORCED this context, on iOS 26 they are dead code either way.
const atWebApp = matchMedia('(display-mode: standalone), (display-mode: minimal-ui),'
  + ' (display-mode: fullscreen), (display-mode: window-controls-overlay)');
const atWebAppLive = matchMedia('(display-mode: standalone), (display-mode: minimal-ui),'
  + ' (display-mode: window-controls-overlay)');
const inWebApp = !isOwner && (navigator.standalone === true
  || document.referrer.startsWith('android-app://')
  || atWebApp.matches);
if(inWebApp) $('webAppGate').classList.add('show');
else connect();
atWebAppLive.addEventListener('change', e => {
  if(!isOwner && e.matches && !pairExpired){
    try { es.close(); } catch {}
    $('webAppGate').classList.add('show');
  }
});

// Pairing-expiry probe: EventSource never surfaces HTTP statuses, so a token
// rotated by a server restart looks identical to a dead server. Every SSE
// failure and every down-channel poll cycle checks /list once: a 403 answers
// at once and trips pairExpiredNow (the overlay replaces the stale snapshot
// within ~a retry delay, so an old tab never lingers as a "usable" main UI);
// a network failure (server still closed) is swallowed — the probe is also
// half of "watch for the PC coming back". The in-flight guard dedupes, since
// EventSource can fire `error` on a ~1s retry cadence.
let pairProbeInFlight = false;
function probePairing(){
  if(pairExpired || pairProbeInFlight) return;
  pairProbeInFlight = true;
  fetch('/list')
    .then(r => { if(r.status === 403) pairExpiredNow(); })
    .catch(() => {})
    .finally(() => { pairProbeInFlight = false; });
}

// One reconcile pass: everything that can fall behind re-pulls both mirrors.
// Driven by the `resync` event, a (re)connect and a return to the foreground —
// never by per-state timers.
function reconcile(){
  probePairing();       // 403 is asked before anything else refreshes: the
                        // overdue overlay must not wait for the probe interval.
  if(pairExpired) return;
  refresh();
  resyncProgress();
}

// Watchdog: the server heartbeats every 1s when the stream is idle, and any
// named event also proves the link alive (see lastSeen above), so >3s of total
// silence with the channel NOT already failing means the socket is half-open —
// EventSource will never notice on its own. Force a fresh connection; its
// `open` replays state. The same tick expires stale rings (see
// pruneIdleRings) — no extra timer, one 1s loop covers both.
setInterval(() => {
  if(pairExpired) return;
  if(!esDown && lastSeen && Date.now() - lastSeen > 3000){
    clientLog('sse watchdog reconnect (silent ' + (Date.now() - lastSeen) + 'ms)');
    lastSeen = Date.now();
    try { es.close(); } catch {}
    connect();
  }
  pruneIdleRings();
}, 1000);

// A backgrounded phone/browser can have its EventSource suspended (Chrome keeps
// it "open" but delivers nothing), so on return to the foreground there is no
// new SSE event to nudge a refresh. Reconcile here.
document.addEventListener('visibilitychange', () => {
  // Quiet by design: every lock/unlock would otherwise POST /log.
  if(document.visibilityState === 'visible') reconcile();
});

let fwWasShown = false;
let fwPhase = null;       // null | 'launched' | 'granted'
// Firewall repair flag arrives as an SSE `fw` event (the server pushes only on
// change); no /fw-status polling. The flag means the rule table is not the
// canonical exactly-one-Allow-on-Any-profile: an applicable Block, a Block
// scoped to another profile, or mere table hygiene (dialog Query strays,
// duplicates, disabled leftovers). The overlay is PREVENTIVE on purpose — it
// may appear while the current network still works — because the failure it
// guards against is SILENT: the Windows dialog's Allow covers only the profile
// active at answer time, and when a Private<->Public switch moves the machine
// under a non-covered profile, inbound is default-blocked with NO second
// prompt (a denied or already-ruled program is never re-asked), so the phone
// just dies with no UI to repair from. Hence repair-now, not
// repair-on-failure. There is no dismiss: the fix is one UAC prompt, and
// after it the all-profile Allow makes the issue permanent-impossible.
function fwButtons(allow, quit, hint){
  $('fwRepair').disabled = allow;
  $('fwQuit').disabled = quit;
  if(hint !== undefined) $('fwHint').textContent = hint;
}
function fwBusy(on){ $('fwHint').classList.toggle('busy', !!on); }
// 'granted' is the one reliable proof the repair actually started (the
// elevated script's STARTED marker; the launcher exit code cannot tell —
// ShellExecute succeeds even on cancel). From then on 允许 stays disabled for
// good: a second run would not fix what the first could not. 退出 is never
// disabled — quitting is safe, since the elevated repair is an independent
// process that finishes on its own. A cancelled prompt sends nothing, so 允许
// stays disabled too; retrying means a relaunch.
function applyFwPhase(phase){
  if(!isOwner || !$('fwOverlay').classList.contains('show')) return;
  if(phase !== 'granted') return;
  fwPhase = 'granted';
  fwBusy(true);
  fwButtons(true, false, '已授权,正在应用规则…');
}
function applyFw(needRepair){
  // Owner-only overlay: the repair flow raises a UAC prompt on the PC and the
  // quit button kills the process — neither is a guest's business.
  // The server also refuses /repair, /quit and /untop from non-loopback, so
  // this early return only keeps the phone's screen clean.
  if(!isOwner) return;
  const show = !!needRepair;
  $('fwOverlay').classList.toggle('show', show);
  if(fwWasShown && !show){
    // The worker (or connection evidence) just cleared the flag — the fix
    // landed. The success toast lives HERE, not in the repair click: the
    // repair return only means "UAC granted", the confirmation is this
    // transition.
    serverFetch('/untop', {method:'POST'}).catch(()=>{});
    toast('防火墙已放行，可以连接了');
  }
  if(!show){
    // Overlay gone: no repair is in flight any more.
    fwPhase = null;
    fwBusy(false);
    $('fwHint').textContent = '';
  }
  fwWasShown = show;
}
$('fwRepair').onclick = async () => {
  // The click disables 允许 and it is never re-enabled by a timer: from here
  // the only exits are the worker closing the overlay (success) or 退出.
  fwBusy(false);
  fwButtons(true, false, '请在“用户帐户控制”窗口中确认授权…');
  try {
    const r = await serverFetch('/repair', {method:'POST'});
    const txt = await r.text();
    if(txt.trim() === 'ok'){
      // The launcher is spawned — the UAC prompt (if any) is on screen now.
      // 'granted' (elevated script really started) freezes 允许 for good.
      if(fwPhase === null) fwPhase = 'launched';
    } else {
      // The request itself failed — no UAC prompt was raised, so a retry is
      // meaningful: re-enable 允许.
      fwPhase = null;
      fwButtons(false, false, '未获授权,请点击“允许”重试。');
    }
  } catch(e) {
    fwPhase = null;
    fwButtons(false, false, '请求失败,请重试');
  }
};
$('fwQuit').onclick = () => { serverFetch('/quit', {method:'POST'}).catch(()=>{}); };

// QR lightbox: the small header QR opens a large scan-ready version on click.
// Closing is explicit — the card's ✕ button or the Escape key; the backdrop
// does not swallow clicks (no accidental dismissal when a stray click lands
// beside the card).
// Swap the QR only after the new bytes have decoded, so the img is never
// cleared mid-request. Setting src directly can blank the element for a frame,
// which reads as the lightbox's white placeholder flashing before the code.
function loadQr(src){
  const next = new Image();
  next.onload = next.onerror = () => { $('qrImg').src = src; };
  next.src = src;
}
function openQrLightbox(){
  // The QR <img> has no page-load src (see the tag); every open requests it
  // cache-busted, so a network change can never leave a stale code showing.
  // loadQr keeps the warmed frame (see the owner preload below) on screen
  // until the fresh one is ready. The dot is deliberately NOT cleared
  // here: the unread cue is one entity (dot while closed, warning while open)
  // that clears only when the card is CLOSED, so opening just swaps one surface
  // for the other. With no LAN address there is nothing to fetch — the lightbox
  // explains instead (see applyInfo / .ql-nolan).
  if(lanUsable) loadQr('/qr?r=' + Date.now());
  else $('qrImg').removeAttribute('src');
  $('qrLightbox').classList.add('show');
}
function closeQrLightbox(){
  // Guarded: the Escape handler calls this unconditionally, and a stray close
  // must never dismiss a change the user has not actually looked at.
  if(!$('qrLightbox').classList.contains('show')) return;
  $('qrLightbox').classList.remove('show');
  // Closing the card is the one "seen" event: retire the whole unread cue —
  // the in-card warning and the button dot go together.
  $('qrLightbox').classList.remove('net-changed');
  $('connectBtn').classList.remove('alert');
}
$('connectBtn').onclick = openQrLightbox;
$('qlClose').onclick = closeQrLightbox;
// PC-only preload: warm the QR once so the first lightbox open shows a frame
// immediately instead of the img's white placeholder (the phone never opens
// this card, so it stays request-free; /qr is no-store, so the open still
// fetches fresh — this only removes the blank first frame).
if(isOwner && lanUsable) $('qrImg').src = '/qr';
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeQrLightbox(); $('clearOverlay').classList.remove('show'); $('settingsOverlay').classList.remove('show'); }
});

if(isOwner){
  // Owner console header, shared by the webview and a loopback desktop
  // browser: both carry owner powers, so every button here works in both —
  // no dead entries by construction. Guests (phone, desktop LAN browser) get
  // the headerless transfer UI below instead.
  // The OS title bar already brands the window (icon + "tinbox") immediately
  // above the page header; painting the brand twice in 60px of vertical space
  // is duplication (a loopback browser tab titles itself the same way).
  document.querySelector('.brand').style.display = 'none';
  // The hidden brand leaves .head-actions the sole visible child of the
  // space-between bar — it would sit left with a dead void on the right.
  // Split the entry from the tools instead: inbox/settings stay left, the
  // connect pill docks right as a DIRECT child of the bar, so space-between
  // spreads the two groups (an auto margin inside .head-actions cannot work:
  // a sole flex item shrink-wraps, the free space lives in the parent).
  document.querySelector('.head').appendChild($('connectBtn'));
  document.querySelector('.head-sep').style.display = 'none';
  // No connect gate: the timeline paints on the first list, paired or not.
  // Pairing is enforced per request by the server's token middleware, so the
  // page never needs to wait for (or block on) a device. The header QR stays
  // the scan entry; the Inbox button is a real folder — the transfer landing
  // zone on disk — and nothing else.
} else {
  // Every guest — phone or desktop LAN browser — gets the same headerless
  // transfer UI. Owner tools live in the header above, so there is nowhere a
  // dead button can appear (no broken connect pill, no redundant brand).
  // Behavior gates below still follow isOwner, not isWebview: a loopback
  // browser keeps its working card menu (open/reveal pass the server's
  // guard). Coarse-pointer phones never reach here either way: CSS hides the
  // bar as a no-JS fallback.
  document.querySelector('.head').style.display = 'none';
}

// Report client-side exceptions into the server log, so a failure on the phone
// (where tinbox.log is not directly readable) still lands in tinbox.log with a
// "client:" prefix. Every line carries a monotonic sequence number, so a lost
// POST (e.g. a fetch that loses the unfreeze race right after a page wakes and
// its catch swallows the failure) shows up as a visible gap instead of a
// silent hole. One silent retry on a fresh connection — same decision tree as
// add-local.
let clientLogSeq = 0;
function reportClientError(msg){
  const tag = '#' + (++clientLogSeq) + ' ' + msg;
  serverFetch('/log', { method:'POST', body:{ msg: tag } }).catch(() => {
    setTimeout(() => {
      serverFetch('/log', { method:'POST', body:{ msg: tag + ' (retry)' } }).catch(()=>{});
    }, 1000);
  });
}
// General client-side diagnostics over the same channel: a bounded, one-line
// POST to /log, so the PC's single log file covers what the phone saw too.
// Used by the transfer path (which previously logged nothing client-side) and
// the SSE watchdog; never per chunk/byte.
function clientLog(msg){ reportClientError(msg); }
window.addEventListener('error', e => {
  reportClientError((e.message || 'unknown error') + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
});
window.addEventListener('unhandledrejection', e => {
  const r = e.reason;
  const msg = (r && (r.message || r.toString())) || String(r);
  reportClientError('unhandledrejection: ' + msg);
});

// `?t=` is left in the URL for the whole session (no history scrub): the token
// is the credential, and keeping it makes the address bar copy-pasteable to
// another browser on the same LAN without a rescan. Reloads therefore re-fire
// the server's Paired broadcast — accepted as harmless (rare, and only a
// redundant "connected" toast on the PC). The cookie still authenticates the
// requests that carry no query (SSE, /list, /view).

refresh();
</script>
</body>
</html>
