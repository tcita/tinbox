[package]
name = "tinbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tinbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
local-ip-address = "0.6"
open = "5"
qrcode = "0.14"
# CF_HDROP file copies for the PC's right-click Copy (the web Clipboard API
# cannot carry files).
clipboard-win = "5"
# PNG for the QR-code encoder; JPEG for Shell-extracted video posters.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Compile optimizations + small binary, for portable long-running use.
# thin LTO + parallel codegen + incremental keep small-step iteration fast
# (fat LTO re-optimizes every dependency on each rebuild).
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 8
strip = true
incremental = true
