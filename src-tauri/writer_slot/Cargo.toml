[package]
name = "writer-slot"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Loom is only pulled in for the model-checker run; a normal build of the app
# (which depends on this crate by path) never compiles it:
#   RUSTFLAGS="--cfg loom" cargo test
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
# Same diagnostic wiring loom's own `model()` installs, so `LOOM_LOG=info`
# prints "Completed in N iterations" for the bounded builder runs.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
